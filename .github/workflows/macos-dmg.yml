name: macOS DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    strategy:
      matrix:
        include:
          # deploy_target moves out of job-level env and into the matrix. It was
          # two env vars read by steps that each re-branched on matrix.label; it
          # is now one per-leg value, which is what lets the cache keys below
          # carry it — a cache step cannot see a value that a `run:` block picks
          # with an if/else.
          #
          # The legs differ on purpose. Apple Silicon stays at 14.0 because
          # CMakeLists.txt gates the ASR Metal kernels on it (>= 14.0 builds
          # metal3.1 with bf16, below that metal3.0 with props.has_bfloat
          # clamped) and upstream ONNX Runtime 1.27.0 is built at exactly 14.0 —
          # no Apple Silicon Mac is stuck below it. Intel goes to 12.0: nothing
          # in that artifact needs a higher floor, and it exists to serve the
          # aging hardware that cannot go higher (#4532).
          #
          # arch is the qtkeychain cache-key tag, kept separate from label so the
          # Apple Silicon key stays byte-identical to ci.yml's — that sharing is
          # deliberate (same source, same Qt, same runner class).
          - runner: macos-15
            label: apple-silicon
            arch: arm64
            deploy_target: '14.0'
          - runner: macos-15-intel
            label: intel
            arch: x86_64
            deploy_target: '12.0'
    runs-on: ${{ matrix.runner }}

    # One place each for the versions this workflow pins. ci.yml's check-macos
    # pins the same values and shares the qtkeychain cache key built from them.
    env:
      QT_VERSION: '6.8.3'
      AQTINSTALL_VERSION: '3.3.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false  # skip post-run cleanup — the aqt Qt tree is large

      - name: Install dependencies via Homebrew
        run: |
          # No Homebrew Qt on either leg. Apple Silicon used to take qt@6 here,
          # which is a rolling formula — it shipped 6.11.1 while every other
          # artifact pinned 6.8.3, so the most-downloaded macOS artifact linked
          # a Qt no other build tested and could change between tags with no PR
          # (#4688 §1). Both legs now take the same pinned aqt Qt below.
          #
          # qtkeychain likewise: the Homebrew formula is compiled against
          # Homebrew Qt, so taking it here would reintroduce the exact ABI
          # mismatch #4685 removed on Linux — and one that fails silently,
          # because find_package(Qt6Keychain QUIET) just compiles credential
          # persistence out (#3639). It is built from source against the aqt Qt.
          #
          # fftw, portaudio and hidapi are gone for a third reason, and it is the
          # one that was actually breaking users. A Homebrew bottle is compiled
          # for the OS it was built on: this job resolves arm64_sequoia (minos
          # 15.0) on macos-15 and sonoma (minos 14.0) on macos-15-intel, because
          # Homebrew publishes no newer Intel bottle. macdeployqt stages those
          # dylibs into the bundle and dyld enforces their minos, so the DMG's
          # real floor was the runner image's OS — the Apple Silicon DMG declared
          # 14.0 and needed 15, the Intel DMG declared 13.0 and needed 14. That
          # is #4532, and it is the same mechanism #802 diagnosed for Qt and
          # fixed for Qt alone. scripts/setup/setup-macos-deps.sh builds all
          # three at our floor instead.
          #
          # What is left is build tooling that never gets linked into the app, so
          # its own deployment target is irrelevant. pkg-config is explicit
          # rather than incidental: CMakeLists.txt finds portaudio and hidapi
          # through pkg_check_modules, which quietly finds nothing at all when
          # pkg-config is missing, compiling both features out without an error.
          brew install ninja create-dmg autoconf automake libtool pkg-config

      - name: Install Qt LTS via aqtinstall
        run: |
          set -o pipefail
          # aqt goes in a venv rather than `pip3 install --user` or
          # --break-system-packages: whether the runner's python3 is PEP 668
          # externally-managed depends on the image and on whether a Homebrew
          # formula pulled in its own python, and --break-system-packages is
          # itself a pip>=23 option. A venv is correct regardless of both.
          # Same reasoning as .github/docker/Dockerfile.
          #
          # aqt is pinned for the same reason Qt is: it is the tool that decides
          # which Qt lands in the DMG, so leaving it floating would put an
          # unreviewed dependency back on the release path this PR exists to
          # close. .github/docker/Dockerfile pins it and says so; appimage.yml
          # does not, and should — separate change, separate artifact.
          python3 -m venv "$RUNNER_TEMP/aqtvenv"
          "$RUNNER_TEMP/aqtvenv/bin/pip" install -q "aqtinstall==${AQTINSTALL_VERSION}"
          # Qt publishes ONE macOS desktop build, clang_64, and it serves BOTH
          # legs — verified by inspecting the shipped binary, not the docs:
          #
          #   $ file .../QtCore.framework/Versions/A/QtCore
          #   Mach-O universal binary with 2 architectures: x86_64, arm64
          #   $ llvm-otool -l ... | grep -A4 LC_BUILD_VERSION
          #   platform 1   sdk 14.4   minos 12.0
          #
          # minos 12.0 is what retires the Intel from-source build. #802 built Qt
          # by hand because "Homebrew Qt bottles on macos-15-intel target macOS
          # 14.0, breaking on 2017 iMacs stuck on Ventura" — a property of
          # HOMEBREW's bottles, not of Qt. Qt's own binary reaches further back
          # than the 13.0 we were hand-building for. The option was invisible at
          # the time only because #711 had removed aqt from macOS the previous
          # day, for the unrelated dual-Qt conflict.
          #
          # `aqt list-qt mac desktop --arch 6.8.3` returns clang_64 alone, and
          # all four modules below are published for it.
          "$RUNNER_TEMP/aqtvenv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 \
            -m qtmultimedia qtwebsockets qtserialport qtshadertools \
            --outputdir "${{ github.workspace }}/Qt"
          QT_ROOT="${{ github.workspace }}/Qt/$QT_VERSION/macos"
          # Assert the layout rather than trusting it: a wrong QT_ROOT would
          # sail through configure (Homebrew's Qt could satisfy find_package if
          # it were ever reinstalled by another formula) and only surface as a
          # subtly mis-deployed DMG. Same guard appimage.yml uses.
          if [ ! -x "$QT_ROOT/bin/qmake" ]; then
            echo "ERROR: no qmake at $QT_ROOT — aqt layout changed"
            ls -la "${{ github.workspace }}/Qt/$QT_VERSION/" || true
            exit 1
          fi
          # PATH goes through GITHUB_PATH, not GITHUB_ENV: the latter would
          # freeze this step's PATH verbatim for every later step, silently
          # discarding anything a subsequent action prepends.
          {
            echo "QT_ROOT=$QT_ROOT"
            echo "CMAKE_PREFIX_PATH=$QT_ROOT"
          } >> "$GITHUB_ENV"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"
          "$QT_ROOT/bin/qmake" -query QT_VERSION

      # Why this guard exists — the history is easy to lose and expensive to
      # relearn. #711 ("drop aqtinstall, use Homebrew for everything") removed
      # aqt from macOS precisely because an aqt Qt and a Homebrew Qt visible at
      # the same time produced "Qt6GuiPrivate and linker failures", and #812 hit
      # the same clash on Intel against the source-built Qt ("their CMake
      # configs clash"). The real constraint is not "aqt is wrong on macOS" —
      # it is that TWO discoverable Qt trees break the build.
      #
      # In both incidents the second Qt arrived transitively rather than by
      # request: brew's qtkeychain depends on qtbase. This job installs neither
      # qtkeychain nor any Qt formula, so there is exactly one Qt — but
      # CMAKE_PREFIX_PATH still carries $(brew --prefix) for fftw/portaudio/
      # hidapi, so a future formula that pulls qtbase in, or a runner image that
      # ships Qt preinstalled, would silently recreate #711. Assert it.
      - name: Assert no Homebrew Qt is discoverable
        run: |
          set -o pipefail
          if brew list --formula 2>/dev/null | grep -qE '^(qt|qt@[0-9]+|qtbase)$'; then
            echo "ERROR: a Homebrew Qt is installed alongside the aqt Qt:"
            brew list --formula | grep -E '^(qt|qt@[0-9]+|qtbase)$'
            echo "Two discoverable Qt trees is the #711 / #812 failure mode."
            echo "Find the formula that pulled it in (qtkeychain depends on"
            echo "qtbase) and drop it, or this build links a mixed Qt."
            exit 1
          fi
          if [ -f "$(brew --prefix)/lib/cmake/Qt6/Qt6Config.cmake" ]; then
            echo "ERROR: a Qt6 CMake config exists under $(brew --prefix)"
            echo "even though no Qt formula is listed — CMAKE_PREFIX_PATH"
            echo "includes that prefix and could resolve Qt from it."
            exit 1
          fi
          echo "No Homebrew Qt present; the aqt tree at $QT_ROOT is the only one."

      - name: Cache macOS deps (fftw, portaudio, hidapi)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-macos-deps
        with:
          path: third_party/macos-deps
          # The deployment target is IN the key. It is the one thing the build
          # bakes in that nothing downstream can correct, so a 14.0 tree must
          # never restore into a 12.0 build — that would silently recreate the
          # bug this change exists to remove.
          key: macos-deps-${{ matrix.label }}-deploy${{ matrix.deploy_target }}-${{ hashFiles('scripts/setup/setup-macos-deps.sh') }}

      # ~8 min cold, then cached until the script or the target changes — the
      # same deal third_party/qtkeychain already has. That cost buys the DMG a
      # deployment target that describes the DMG instead of the runner image.
      - name: Build macOS deps at the deployment target
        if: steps.cache-macos-deps.outputs.cache-hit != 'true'
        env:
          MACOS_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
        run: bash scripts/setup/setup-macos-deps.sh

      - name: Cache qtkeychain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-qtkeychain-mac
        with:
          path: third_party/qtkeychain
          # Keyed on every input that changes the dylib, not just the script:
          # it is an ABI match for one specific Qt, and it carries one specific
          # LC_BUILD_VERSION. matrix.arch rather than matrix.label so the Apple
          # Silicon key stays byte-identical to ci.yml's — that sharing is
          # deliberate (that job runs on push:main, and default-branch caches
          # are visible to every ref, so the entry restored here is normally the
          # one check-macos wrote). Intel gets its own key; nothing else builds
          # that leg's qtkeychain.
          key: qtkeychain-macos-${{ matrix.arch }}-qt${{ env.QT_VERSION }}-deploy${{ matrix.deploy_target }}-${{ hashFiles('scripts/setup/setup-qtkeychain.sh') }}

      # Both legs now. #812 gave up SmartLink credential persistence on Intel
      # ("qtkeychain pulls in qt@6 as a dependency, so skip it too") purely to
      # dodge the Homebrew-Qt clash. With Qt coming from aqt and qtkeychain built
      # against it from source, that trade is no longer required.
      #
      # MACOS_DEPLOYMENT_TARGET is not optional here: CMake otherwise leaves the
      # deployment target empty and clang stamps the runner's own OS (15.x) into
      # the dylib, which CMakeLists.txt then copies into Contents/Frameworks —
      # dyld refuses to load it on anything older.
      - name: Setup qtkeychain (SmartLink credential persistence)
        if: steps.cache-qtkeychain-mac.outputs.cache-hit != 'true'
        env:
          MACOS_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
        run: bash scripts/setup/setup-qtkeychain.sh

      - name: Cache DeepFilterNet3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-deepfilter
        with:
          path: third_party/deepfilter
          # deploy_target for the same reason as the two caches above: the DFNR
          # library is a Rust cdylib staged into Contents/Frameworks, so it
          # carries an LC_BUILD_VERSION into the bundle like any other dependency.
          key: deepfilter-${{ runner.os }}-${{ runner.arch }}-deploy${{ matrix.deploy_target }}-${{ hashFiles('scripts/setup/setup-deepfilter.sh') }}

      - name: Setup DeepFilterNet3 (DFNR)
        if: steps.cache-deepfilter.outputs.cache-hit != 'true'
        env:
          # cargo/rustc read MACOSX_DEPLOYMENT_TARGET straight from the
          # environment; there is no flag to pass through the script.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
        run: bash scripts/setup/setup-deepfilter.sh

      - name: Setup ONNX Runtime (Silero VAD + speaker labeling + signal classifier)
        # ONNX Runtime 1.27 ships no Intel-macOS prebuilt (Apple-Silicon only).
        # That was the first reason the Intel DMG went without the ONNX ASR
        # features; it now ships no ASR at all (ENABLE_ASR=OFF, see Configure).
        # Apple Silicon requires them.
        if: matrix.label == 'apple-silicon'
        run: bash scripts/setup/setup-onnxruntime.sh

      - name: Setup sherpa-onnx (non-whisper ASR backend)
        # Apple Silicon only, and the reason is the deployment floor rather than
        # the architecture: sherpa's universal2 prebuilt would run on Intel, but
        # the ONNX Runtime it carries is built at minos 15.5 on BOTH slices, and
        # the app links it at load time. No prebuilt ORT is low enough to fix
        # that on Intel — upstream 1.27.0 is arm64-only at 14.0, and the last
        # universal2 build (1.22.0) is 13.3 — so the Intel DMG would have to
        # advertise macOS 15.5 to be honest about what it ships, which is
        # useless on hardware that mostly stops at 13.
        #
        # That left Intel on whisper.cpp alone, and it no longer ships even that:
        # ENABLE_ASR=OFF on that leg (see Configure for the reasoning). This step
        # and the ONNX one above are Apple-Silicon-only for both reasons now.
        #
        # setup-sherpa-onnx.sh drops sherpa's bundled ORT on macOS so the Apple
        # Silicon leg carries exactly one runtime — the upstream 14.0 build
        # staged above — instead of silently preferring the 15.5 copy.
        if: matrix.label == 'apple-silicon'
        run: bash scripts/setup/setup-sherpa-onnx.sh

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: ccache-macos-${{ matrix.label }}
          max-size: 500M

      - name: Ensure offline Metal toolchain
        # The ASR Metal kernels are compiled at build time (#4535), and this job
        # configures with REQUIRE_ASR_GPU=ON, which makes a missing offline Metal
        # compiler a hard configure failure rather than a silent fallback to the
        # runtime-compile path. Xcode 16 bundles the component (probe succeeds,
        # step is a no-op); Xcode 26 ships it as a separate download, so this is
        # what keeps a runner-image bump from breaking a release tag build.
        #
        # Apple Silicon only: the Intel leg builds ENABLE_ASR=OFF, so it compiles
        # no Metal kernels and has no use for the toolchain.
        if: matrix.label == 'apple-silicon'
        run: |
          xcrun -sdk macosx metal --version >/dev/null 2>&1 || \
            sudo xcodebuild -downloadComponent MetalToolchain

      - name: Configure
        run: |
          # Without pipefail the step's exit status is tee's, so a cmake failure
          # would look green. Set it in the script rather than via `shell: bash`
          # (which also implies -eo pipefail) so the guard is self-contained and
          # survives anyone editing the step's shell. Same as appimage.yml.
          set -o pipefail
          # One Qt for both legs: $QT_ROOT, the aqt tree exported by the install
          # step. Not $(brew --prefix) (Homebrew's rolling qt@6, #4688 §1) and no
          # longer $PWD/qt-install (the retired Intel from-source build).
          QT_PREFIX="$QT_ROOT"
          # fftw/portaudio/hidapi come from third_party/macos-deps, built at this
          # leg's deployment target. It goes BEFORE $(brew --prefix) so that if a
          # formula ever reintroduces one of them transitively the correctly
          # targeted copy still wins — and PKG_CONFIG_PATH matters as much as
          # CMAKE_PREFIX_PATH, because portaudio and hidapi are found through
          # pkg_check_modules rather than find_library.
          DEPS_PREFIX="$PWD/third_party/macos-deps"
          export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # Intel Mac: disable GPU rendering — QRhiWidget has issues on
          # older Metal/OpenGL hardware. Apple Silicon renders via QRhi.
          # Both legs state the value rather than leaning on the CMake default,
          # so the intent is readable here and the assertion below has a
          # request to check against.
          GPU_FLAG="-DAETHER_GPU_SPECTRUM=ON"
          if [ "${{ matrix.label }}" = "intel" ]; then
            GPU_FLAG="-DAETHER_GPU_SPECTRUM=OFF"
          fi
          # ASR is an Apple-Silicon-only feature of the macOS DMGs, and the split
          # is now total rather than partial. Apple Silicon requires all three
          # pieces — the Metal GPU backend, the ONNX extras and the sherpa
          # backend — so that a silent compile-out cannot ship. Requiring them
          # where they are staged is what keeps that honest.
          #
          # Intel builds ENABLE_ASR=OFF outright. #4706 had already stripped it
          # to CPU whisper alone (no ONNX, no sherpa: their ONNX Runtime carries
          # a minos 15.5 floor no prebuilt can lower, and the Intel DMG exists to
          # serve hardware that mostly stops at 13). What remained then broke on
          # its own: dropping the Intel floor to 12.0 moved that leg onto the
          # metal2.x shader tier for the first time, which #4718 found to be
          # misspelled and which is unproven beyond that — ggml's kernels may use
          # unguarded Metal-3 intrinsics that cannot compile at 2.4 at all.
          #
          # Rather than keep discovering that a release-day workflow at a time,
          # the Intel artifact drops speech-to-text. It is a deliberate product
          # call on fewer than 30 Intel-Mac users in the download figures, not a
          # build workaround: an Intel Mac has no GPU worth running ASR on, and
          # CPU-only whisper on that hardware is not a feature worth the release
          # risk. REQUIRE_ASR_GPU therefore is NOT passed on Intel — with ASR off
          # there is no GPU backend to require, and asking for one would fail
          # configure.
          ASR_FLAGS="-DENABLE_ASR=OFF"
          if [ "${{ matrix.label }}" = "apple-silicon" ]; then
            ASR_FLAGS="-DREQUIRE_ASR_GPU=ON -DREQUIRE_ASR_ONNX=ON -DREQUIRE_ASR_SHERPA=ON"
          fi
          # Both legs: qtkeychain is built from source against the aqt Qt, so
          # make its absence fatal. find_package(Qt6Keychain QUIET) otherwise
          # compiles SmartLink credential persistence out without a word, which
          # is how the AppImage shipped broken persistence for several releases
          # (#3639). Intel is no longer exempt — it only ever was because #812
          # had to drop Homebrew qtkeychain to dodge the Qt clash.
          KEYCHAIN_FLAG="-DREQUIRE_KEYCHAIN=ON"
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deploy_target }}" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$DEPS_PREFIX;$(brew --prefix)" \
            -DMQTT_TLS=OFF \
            $ASR_FLAGS \
            $KEYCHAIN_FLAG \
            $GPU_FLAG 2>&1 | tee configure.log

      # Apple Silicon only — the Intel leg asks for OFF on purpose (see above).
      # Same reasoning as appimage.yml and windows-installer.yml: CMake turns
      # AETHER_GPU_SPECTRUM back OFF without failing when Qt6GuiPrivate can't be
      # located, so the DMG could ship the CPU QPainter fallback with this
      # workflow green.
      #
      # This is not hypothetical here. Homebrew Qt shipped the Qt6GuiPrivate
      # CMake package, which is the only reason this leg went unguarded for so
      # long; the aqt Qt above does not, and the private headers sit in a
      # framework layout CMakeLists.txt did not probe for. Pinning the Qt
      # without also teaching CMake that layout turned this feature off
      # silently — this assertion is what makes that impossible to ship.
      #
      # Assert on the configure output, not CMakeCache.txt: CMakeLists.txt
      # disables the feature with a plain set(), which shadows the cache entry
      # without rewriting it, so the cache still reads ON when it is off.
      # -iE, not the -i "a\|b" form appimage.yml uses: that file runs on GNU
      # grep, where \| is BRE alternation. This one runs on the macOS runner's
      # BSD grep, which has no BRE alternation and would search for the literal
      # string "GPU spectrum|Qt6GuiPrivate|private headers" — printing nothing
      # under the ERROR header, on the one path where this step has to explain
      # itself. Every other multi-pattern grep in this file already uses -E.
      - name: Assert GPU spectrum rendering actually enabled
        if: matrix.label == 'apple-silicon'
        run: |
          grep -q "GPU spectrum rendering enabled" configure.log || {
            echo "ERROR: -DAETHER_GPU_SPECTRUM=ON but CMake disabled it. Relevant output:"
            grep -iE "GPU spectrum|Qt6GuiPrivate|private headers" configure.log || true
            exit 1
          }
          grep "GPU spectrum rendering enabled" configure.log

      # The mirror of the above, and cheap: the Intel leg asks for OFF because
      # QRhiWidget misbehaves on older Metal/OpenGL hardware, so a change that
      # quietly turned it back ON here would ship exactly the artifact that
      # decision exists to prevent. Asserting both directions is what makes
      # GPU_FLAG's two values a tested contract rather than a comment.
      - name: Assert GPU spectrum rendering actually disabled
        if: matrix.label == 'intel'
        run: |
          grep -q "GPU spectrum rendering disabled" configure.log || {
            echo "ERROR: -DAETHER_GPU_SPECTRUM=OFF but CMake enabled it. Relevant output:"
            grep -iE "GPU spectrum|Qt6GuiPrivate|private headers" configure.log || true
            exit 1
          }
          grep "GPU spectrum rendering disabled" configure.log

      - name: Build
        # Only the .app bundle ships (+ its aether-dv-waveform helper dependency,
        # which stages AetherDV.cfg + runtime payloads via POST_BUILD). The default
        # `all` target also builds ~200 unit-test executables the DMG never bundles
        # or runs. (The DAX driver is built separately in the driver-build step.)
        run: cmake --build build --target AetherSDR aether-dv-waveform -j$(sysctl -n hw.ncpu)

      - name: Bundle DFNR model
        run: |
          if [ -f third_party/deepfilter/models/DeepFilterNet3_onnx.tar.gz ]; then
            mkdir -p build/AetherSDR.app/Contents/Resources
            cp third_party/deepfilter/models/DeepFilterNet3_onnx.tar.gz \
              build/AetherSDR.app/Contents/Resources/
          fi

      - name: Build DAX audio driver
        run: |
          # Same matrix.deploy_target as the app. The driver installs outside the
          # bundle, so the floor assertion below never sees it — if it were built
          # to a higher floor the app would launch on the older OS and then fail
          # to load its own audio driver, with nothing catching it.
          cmake -B driver-build hal-plugin \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deploy_target }}"
          cmake --build driver-build -j$(sysctl -n hw.ncpu)
          DESTDIR="$PWD/driver-root" cmake --install driver-build

      - name: Verify binaries
        run: |
          echo "=== App architecture check ==="
          file build/AetherSDR.app/Contents/MacOS/AetherSDR
          lipo -info build/AetherSDR.app/Contents/MacOS/AetherSDR
          echo "=== DAX driver architecture check ==="
          file driver-root/Library/Audio/Plug-Ins/HAL/AetherSDRDAX.driver/Contents/MacOS/AetherSDRDAX
          lipo -info driver-root/Library/Audio/Plug-Ins/HAL/AetherSDRDAX.driver/Contents/MacOS/AetherSDRDAX

      - name: Bundle Qt frameworks
        run: |
          # macdeployqt must come from the SAME Qt the app linked, or it stages
          # frameworks from a different build than the binary resolves against.
          # Both legs link the aqt tree now, so there is one answer — no matrix
          # branch, and no way for the two to drift apart again. ($(brew --prefix
          # qt@6) is what mixed Homebrew's 6.11.1 into the Apple Silicon DMG;
          # $PWD/qt-install was the retired Intel from-source tree.)
          DEPLOYQT="$QT_ROOT/bin/macdeployqt"
          "$DEPLOYQT" build/AetherSDR.app \
            -verbose=1 \
            -always-overwrite

      # The artifact-side half of the pin. Everything upstream of here asserts
      # what we *asked* for; this asserts what the DMG actually carries, which
      # is the claim #4688 §1 makes and #2191 asked for directly ("verify they
      # resolve to the same installation"). Reading it off the staged framework
      # is the only check that survives someone changing QT_ROOT, macdeployqt,
      # or the Homebrew guard without noticing.
      - name: Assert the bundled Qt is the pinned Qt
        run: |
          set -o pipefail
          FW="build/AetherSDR.app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore"
          if [ ! -f "$FW" ]; then
            echo "ERROR: macdeployqt staged no QtCore framework at $FW"
            ls -la build/AetherSDR.app/Contents/Frameworks/ || true
            exit 1
          fi
          # Two independent readings, and the pin has to show up in one of them.
          # Line 2 of `otool -L` on a dylib is its own LC_ID_DYLIB; `strings -a`
          # finds the "Qt <ver> (...)" build string QLibraryInfo::build() returns
          # (-a so it does not skip Mach-O sections it cannot classify). Either
          # alone is a plausible false negative on some future Qt packaging;
          # requiring only one to match keeps this from turning into a red
          # release on a cosmetic change, while a genuinely wrong Qt — the 6.11.1
          # this PR exists to keep out — fails both.
          ID_LINE="$(otool -L "$FW" | sed -n '2p')"
          BUILD_STR="$(strings -a "$FW" | grep -m1 -oE 'Qt [0-9]+\.[0-9]+\.[0-9]+' || true)"
          echo "  install name: ${ID_LINE:-<none>}"
          echo "  build string: ${BUILD_STR:-<none>}"
          # Both legs stage the same aqt Qt now, so one expectation covers both.
          if ! printf '%s\n%s\n' "$ID_LINE" "$BUILD_STR" | grep -qF "$QT_VERSION"; then
            echo "ERROR: the staged QtCore is not the pinned Qt $QT_VERSION."
            echo "macdeployqt staged a different Qt than this workflow installed."
            otool -L build/AetherSDR.app/Contents/MacOS/AetherSDR | head -20
            exit 1
          fi
          echo "Bundled Qt matches the pin ($QT_VERSION)."

      # The other half of the same idea, for the other claim this job makes. dyld
      # enforces LC_BUILD_VERSION minos on every Mach-O it loads, so the DMG's
      # real minimum macOS is the MAXIMUM across everything staged — not
      # CMAKE_OSX_DEPLOYMENT_TARGET, which describes the app's own binary alone.
      # That gap is why Homebrew's fftw/portaudio/hidapi and an untargeted
      # qtkeychain could raise the floor to the runner's OS on a bundle
      # advertising 14.0 / 13.0, with every step green (#4532).
      #
      # After macdeployqt, because that is the first moment the bundle contains
      # everything it ships; before code signing, so a bundle that fails is never
      # signed or notarized.
      - name: Assert nothing in the bundle outranks the deployment target
        run: |
          bash scripts/build/assert-macos-deployment-floor.sh \
            build/AetherSDR.app "${{ matrix.deploy_target }}"

      - name: Import code signing certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings build.keychain

          # Application cert — for codesign (app, driver, DMG)
          echo "$APPLE_CERT_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm cert.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Code sign application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/AetherSDR.app"
          SIGN_ID="Developer ID Application"

          # 1. Sign all dylibs (plugins, helpers, etc.)
          find "$APP" -name "*.dylib" -print0 | xargs -0 -n1 \
            codesign --force --options runtime --timestamp --sign "$SIGN_ID"

          # 2. Sign framework binaries (the actual Mach-O inside each .framework)
          find "$APP/Contents/Frameworks" -name "*.framework" -type d -maxdepth 1 | while read fw; do
            fw_name=$(basename "$fw" .framework)
            fw_binary="$fw/$fw_name"
            if [ -f "$fw_binary" ]; then
              codesign --force --options runtime --timestamp --sign "$SIGN_ID" "$fw_binary"
            fi
            # Sign any nested dylibs inside the framework
            find "$fw" -name "*.dylib" -print0 2>/dev/null | xargs -0 -n1 \
              codesign --force --options runtime --timestamp --sign "$SIGN_ID" 2>/dev/null || true
            # Sign the framework bundle itself
            codesign --force --options runtime --timestamp --sign "$SIGN_ID" "$fw"
          done

          # 2b. Sign any extra helper executables in Contents/MacOS/ (e.g.
          # aether-dv-waveform, the D-STAR ThumbDV helper). The bundle sign in
          # step 3 runs without --deep, and these aren't .dylib or frameworks,
          # so without this they reach notarization unsigned — no Developer ID,
          # no secure timestamp, no hardened runtime — and Apple rejects the
          # whole archive. Skip the bundle's main executable (step 3 signs it).
          find "$APP/Contents/MacOS" -maxdepth 1 -type f ! -name AetherSDR -print0 |
            while IFS= read -r -d '' bin; do
              if file "$bin" | grep -q "Mach-O"; then
                echo "Signing helper executable: $bin"
                codesign --force --options runtime --timestamp --sign "$SIGN_ID" "$bin"
              fi
            done

          # 3. Sign the main app bundle last (no --deep)
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos/AetherSDR.entitlements \
            --sign "$SIGN_ID" \
            "$APP"

          # 4. Verify
          codesign --verify --deep --strict "$APP"
          echo "Code signing verified successfully"

      - name: Code sign DAX driver
        run: |
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" \
            driver-root/Library/Audio/Plug-Ins/HAL/AetherSDRDAX.driver
          codesign --verify --deep --strict \
            driver-root/Library/Audio/Plug-Ins/HAL/AetherSDRDAX.driver
          echo "DAX driver signing verified"

      - name: Import installer certificate for PKG signing
        env:
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          echo "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode > installer-cert.p12
          security import installer-cert.p12 -k build.keychain -P "$APPLE_INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/pkgbuild -T /usr/bin/productsign
          rm installer-cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Build DAX driver PKG
        run: |
          # Extract version from CMakeLists.txt to keep driver PKG in sync
          APP_VERSION=$(sed -n 's/^project(AetherSDR VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)

          # Component package (unsigned — only the outer product archive needs signing)
          pkgbuild \
            --root driver-root \
            --install-location / \
            --identifier com.aethersdr.dax \
            --version "$APP_VERSION" \
            AetherSDRDAX-component.pkg

          # Distribution XML — onConclusion="RequireRestart" triggers the reboot prompt
          cat > distribution.xml <<'DISTXML'
          <?xml version="1.0" encoding="UTF-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>AetherSDR DAX Audio Drivers</title>
              <options customize="never" require-scripts="false"/>
              <pkg-ref id="com.aethersdr.dax" version="__VERSION__"
                       onConclusion="RequireRestart">AetherSDRDAX-component.pkg</pkg-ref>
              <choices-outline>
                  <line choice="com.aethersdr.dax"/>
              </choices-outline>
              <choice id="com.aethersdr.dax" title="AetherSDR DAX Audio Drivers">
                  <pkg-ref id="com.aethersdr.dax"/>
              </choice>
          </installer-gui-script>
          DISTXML
          sed -i '' 's/^          //' distribution.xml
          sed -i '' "s/__VERSION__/$APP_VERSION/g" distribution.xml

          productbuild \
            --distribution distribution.xml \
            --package-path . \
            --sign "Developer ID Installer" \
            "AetherSDR DAX Drivers.pkg"

          echo "DAX driver PKG v${APP_VERSION} built and signed"

      - name: Create DMG
        run: |
          mkdir -p dmg-stage
          ditto build/AetherSDR.app dmg-stage/AetherSDR.app
          cp "AetherSDR DAX Drivers.pkg" dmg-stage/

          # Layout: app (left) + Applications link (right), PKG below Applications
          # NOTE: --background omitted intentionally. docs/assets/logo-invert.png
          # was removed in commit 4670d1d6 ("docs(assets): remove unused
          # logo-invert.png") because it was unused outside this workflow, and
          # the workflow reference was missed during that cleanup. create-dmg
          # falls back to a plain white window background, which is functional
          # but visually plain. Follow-up to add a DMG-specific background
          # image (correct 600x400 aspect ratio, smaller than the 1.8 MB
          # theme screenshots) tracked separately.
          create-dmg \
            --volname "AetherSDR" \
            --volicon "build/AetherSDR.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AetherSDR.app" 150 120 \
            --hide-extension "AetherSDR.app" \
            --app-drop-link 450 120 \
            --icon "AetherSDR DAX Drivers.pkg" 450 290 \
            "AetherSDR-${{ github.ref_name }}-macOS-${{ matrix.label }}.dmg" \
            "dmg-stage/" \
          || true

          # The `|| true` above absorbs create-dmg's well-documented cosmetic
          # non-zero exits from the AppleScript window-arrangement step on
          # macOS runners — the DMG is still produced successfully in those
          # cases (upstream: https://github.com/create-dmg/create-dmg).
          # The `test -f` below is the authoritative check: any real failure
          # (missing asset, write permission, disk-image error) results in
          # no DMG on disk, and we surface that immediately instead of
          # letting Sign DMG fail confusingly one step later. See the v26.6.1
          # release-build chain for the exact symptom this guard catches.
          DMG="AetherSDR-${{ github.ref_name }}-macOS-${{ matrix.label }}.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::create-dmg did not produce $DMG"
            exit 1
          fi

      - name: Sign DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --timestamp \
            --sign "Developer ID Application" \
            AetherSDR-${{ github.ref_name }}-macOS-${{ matrix.label }}.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            AetherSDR-${{ github.ref_name }}-macOS-${{ matrix.label }}.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600 2>&1 | tee notarize-output.txt || true

          # Extract submission ID and fetch detailed log on failure
          SUB_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' notarize-output.txt | head -1)
          if grep -q "Invalid" notarize-output.txt; then
            echo "=== Notarization FAILED — fetching Apple's rejection log ==="
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          xcrun stapler staple \
            AetherSDR-${{ github.ref_name }}-macOS-${{ matrix.label }}.dmg
          echo "Notarization and stapling complete"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macOS-DMG-${{ matrix.label }}
          path: AetherSDR-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: AetherSDR-*.dmg
