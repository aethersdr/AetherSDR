name: Docs

# Builds the user documentation site (docs/user, Docusaurus) and, on main,
# deploys it to Cloudflare Pages at https://docs.aethersdr.com. A manual run
# (workflow_dispatch) on main redeploys without a content change.
#
# It also typesets the printable PDF manual (tools/docs/build_pdf.py: Pandoc
# + Typst). On a pull request the PDF is a render check and a downloadable
# artifact; on main it is deployed with the site as
# https://docs.aethersdr.com/AetherSDR-Manual.pdf; and when a release is
# published it is attached to that release as AetherSDR-Manual-<tag>.pdf,
# with a detached signature (.pdf.asc) made with the release key.
#
# The build is the link check: docusaurus.config.js sets onBrokenLinks,
# onBrokenAnchors and onBrokenMarkdownLinks to 'throw', so a page that links
# to a missing page or heading fails this workflow.
#
# This is NOT a required status check, which is what makes the `paths:`
# filter safe here. A required check that a PR never triggers blocks that PR
# forever (see the note in static-checks.yml); keep the filter only while
# this workflow stays out of branch protection.

on:
  pull_request:
    paths:
      - 'docs/user/**'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/user/**'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  release:
    types: [published]

# Superseded PR runs are cancelled; every main run completes so a deploy is
# never cut off half-way (same expression as ci.yml / static-checks.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Pinned PDF toolchain, installed from the upstream release archives and
# checked against these SHA-256 sums (the digests GitHub records for the
# release assets). Bump version and checksum together.
env:
  PANDOC_VERSION: '3.12.1'
  PANDOC_SHA256: 'd0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8'  # pandoc-3.12.1-linux-amd64.tar.gz
  TYPST_VERSION: '0.15.1'
  TYPST_SHA256: 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c'  # typst-x86_64-unknown-linux-musl.tar.xz

jobs:
  build:
    name: Build docs site
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/user/package-lock.json

      - name: Docs tools compile
        working-directory: .
        run: python3 -m py_compile tools/docs/*.py

      - name: Log Analyzer rules
        working-directory: .
        run: node tools/docs/test_log_rules.mjs

      - name: Generated reference pages are current
        working-directory: .
        run: python3 tools/docs/gen_reference.py --check

      # No package in the lockfile needs its install script for the site
      # build (core-js prints a banner; fsevents is macOS-only).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (fails on any broken link or anchor)
        run: npm run build

      - name: Install Pandoc and Typst
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          mkdir -p bin
          tar -xzf pandoc.tar.gz --strip-components=2 -C bin "pandoc-${PANDOC_VERSION}/bin/pandoc"
          tar -xJf typst.tar.xz --strip-components=1 -C bin typst-x86_64-unknown-linux-musl/typst
          echo "$PWD/bin" >> "$GITHUB_PATH"
          bin/pandoc --version | head -1
          bin/typst --version

      # After the site build, which empties build/: the PDF lands in the
      # site's root and is deployed with it on main.
      - name: Build PDF manual
        working-directory: .
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            version="PR #${PR_NUMBER} @ ${HEAD_SHA::9}"
          else
            version="${GITHUB_REF_NAME} @ ${HEAD_SHA::9}"
          fi
          python3 tools/docs/build_pdf.py --version "$version" \
            --output docs/user/build/AetherSDR-Manual.pdf

      - name: Upload PDF manual
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AetherSDR-Manual
          path: docs/user/build/AetherSDR-Manual.pdf
          if-no-files-found: error
          retention-days: 14

      # The deploy job below takes the finished site, PDF included, from here.
      - name: Upload site
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/user/build
          if-no-files-found: error
          retention-days: 1

  # Publishing is its own job: it checks out nothing and runs only the
  # pinned wrangler-action, with an exact wrangler version (the action
  # otherwise installs the newest 4.x), on the site the build job produced.
  deploy:
    name: Deploy docs site
    needs: build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-pages
    permissions: {}
    steps:
      - name: Check deploy configuration
        id: config
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "configured=$HAS_CF_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CF_TOKEN" != "true" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy."
            echo "Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID to the cloudflare-pages environment to enable it."
          fi

      - name: Download site
        if: ${{ steps.config.outputs.configured == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: docs-site
          path: site

      # First run creates the project; later runs no-op (hence continue-on-error).
      - name: Ensure Pages project exists
        if: ${{ steps.config.outputs.configured == 'true' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: pages project create aethersdr-docs --production-branch main

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.config.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: pages deploy site --project-name=aethersdr-docs --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

  # A published release gets the manual for its tag. The tag's own code
  # renders it here, with a read-only token and no secrets; sign-release-pdf
  # below signs and attaches the finished file in a job that runs none of it.
  release-pdf:
    name: Render PDF manual for release
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
    outputs:
      present: ${{ steps.docs.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check the tag has the docs
        id: docs
        run: |
          if [ -f tools/docs/build_pdf.py ] && [ -f docs/user/sidebars.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG has no docs/user site or tools/docs/build_pdf.py; no PDF manual to attach."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.docs.outputs.present == 'true' }}
        with:
          node-version: 24

      - name: Install Pandoc and Typst
        if: ${{ steps.docs.outputs.present == 'true' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          mkdir -p bin
          tar -xzf pandoc.tar.gz --strip-components=2 -C bin "pandoc-${PANDOC_VERSION}/bin/pandoc"
          tar -xJf typst.tar.xz --strip-components=1 -C bin typst-x86_64-unknown-linux-musl/typst
          echo "$PWD/bin" >> "$GITHUB_PATH"
          bin/pandoc --version | head -1
          bin/typst --version

      - name: Build PDF manual
        if: ${{ steps.docs.outputs.present == 'true' }}
        run: |
          python3 tools/docs/build_pdf.py --version "$TAG" \
            --output "${RUNNER_TEMP}/AetherSDR-Manual-${TAG}.pdf"

      - name: Upload PDF manual
        if: ${{ steps.docs.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manual
          path: ${{ runner.temp }}/AetherSDR-Manual-${{ github.event.release.tag_name }}.pdf
          if-no-files-found: error
          retention-days: 1

  # Signed with the release key, as sign-release.yml signs the binaries.
  # The PDF is not in SHA256SUMS.txt; its .asc is its own check. This job
  # checks out nothing and runs no repository code.
  sign-release-pdf:
    name: Attach PDF manual to release
    needs: release-pdf
    if: ${{ needs.release-pdf.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Not a release tag; refusing to sign."
            exit 1
          fi

      - name: Download PDF manual
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-manual
          path: ${{ runner.temp }}/manual

      # Exactly the one expected file, and a regular file.
      - name: Check the download
        working-directory: ${{ runner.temp }}/manual
        run: |
          pdf="AetherSDR-Manual-${TAG}.pdf"
          listing=$(find . -mindepth 1 -printf '%y %P\n')
          if [ "$listing" != "f $pdf" ]; then
            echo "::error::Expected only $pdf as a regular file; found:"
            printf '%s\n' "$listing"
            exit 1
          fi

      - name: Import GPG key
        env:
          # A keyring of its own, removed at the end of the job.
          GNUPGHOME: ${{ runner.temp }}/gnupg
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FP=$(gpg --list-secret-keys --with-colons | grep fpr | head -1 | cut -d: -f10)
          echo "${KEY_FP}:6:" | gpg --import-ownertrust

      - name: Sign PDF manual (detached .asc)
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: ${{ runner.temp }}/manual
        run: |
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --detach-sign --armor "AetherSDR-Manual-${TAG}.pdf"
          echo "Signed: AetherSDR-Manual-${TAG}.pdf -> AetherSDR-Manual-${TAG}.pdf.asc"

      - name: Verify the signature
        working-directory: ${{ runner.temp }}/manual
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: gpg --batch --verify "AetherSDR-Manual-${TAG}.pdf.asc" "AetherSDR-Manual-${TAG}.pdf"

      # One upload, so the PDF and its signature carry the same timestamp.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "${RUNNER_TEMP}/manual/AetherSDR-Manual-${TAG}.pdf" \
            "${RUNNER_TEMP}/manual/AetherSDR-Manual-${TAG}.pdf.asc" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove the signing keyring
        if: ${{ always() }}
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
