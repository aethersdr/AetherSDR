name: Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_store_flight:
        description: 'Build and fully submit this ref to the Microsoft Store developer flight'
        required: false
        default: false
        type: boolean

# Each job grants itself what it needs. Only package-windows can mint the
# Azure token that signs as the AetherSDR publisher (#6288), and it runs no
# third-party build code: build-windows compiles everything unprivileged and
# hands package-windows the unsigned payload.
permissions:
  contents: read

# A tag name may contain ", ; $ and backticks, so it reaches scripts only as an
# environment variable, never by ${{ }} substitution into the script text.
env:
  REF_NAME: ${{ github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # ninja reads this on the two cmake --build steps below and stamps
      # elapsed seconds per line, so the long-pole targets are visible in
      # the log; the other steps ignore it.
      NINJA_STATUS: "[%f/%t %es] "
    outputs:
      publish-flight: ${{ steps.store-plan.outputs.publishFlight }}
      release-artifacts: ${{ steps.store-plan.outputs.releaseArtifacts }}
      production-draft: ${{ steps.store-plan.outputs.productionDraft }}
      store-eligible: ${{ steps.store-plan.outputs.storeEligible }}
      msix-version: ${{ steps.store-plan.outputs.msixVersion }}
      sign: ${{ steps.sign-plan.outputs.sign }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The one place the signing decision is made; package-windows reads it
      # for both its environment and its signing steps. Release tags (v*) on
      # this repository sign. So do signtest-* tags: the maintainer's signing
      # dry run, dispatched by hand, which reaches the signing identity only
      # while a temporary signtest-* rule is on the windows-signing
      # environment (docs/VERIFYING-RELEASES.md). Anything else, a branch or
      # another tag, runs with no environment and ships unsigned.
      - name: Plan Authenticode signing
        id: sign-plan
        env:
          SIGN: ${{ github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'signtest-')) && github.repository == 'aethersdr/AetherSDR' }}
        run: |
          "sign=$env:SIGN" >> $env:GITHUB_OUTPUT
          Write-Host "Authenticode signing: $env:SIGN"

      # Resolve publication intent before building or authenticating. A manual
      # tag dispatch is still manual: it cannot attach public release assets
      # or stage a production Store draft.
      - name: Plan Store build
        id: store-plan
        env:
          STORE_REQUESTED_FLIGHT: ${{ inputs.publish_store_flight }}
          STORE_EVENT: ${{ github.event_name }}
          STORE_REF: ${{ github.ref }}
          STORE_REPOSITORY: ${{ github.repository }}
          STORE_RUN_NUMBER: ${{ github.run_number }}
          AETHERSDR_STORE_PRODUCT_ID: ${{ vars.AETHERSDR_STORE_PRODUCT_ID }}
          AETHERSDR_STORE_FLIGHT_ID: ${{ secrets.AETHERSDR_STORE_FLIGHT_ID }}
        run: |
          $plan = & .\packaging\windows\get-store-build-plan.ps1 `
            -EventName $env:STORE_EVENT -Ref $env:STORE_REF `
            -Repository $env:STORE_REPOSITORY -RunNumber $env:STORE_RUN_NUMBER `
            -RequestFlight ($env:STORE_REQUESTED_FLIGHT -eq 'true') `
            -ProductId $env:AETHERSDR_STORE_PRODUCT_ID -FlightId $env:AETHERSDR_STORE_FLIGHT_ID
          foreach ($name in @('releaseArtifacts', 'productionDraft', 'publishFlight', 'storeEligible')) {
            "$name=$($plan.$name.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          }
          "msixVersion=$($plan.msixVersion)" >> $env:GITHUB_OUTPUT
          if (-not $plan.storeEligible) {
            # A plain Write-Warning stays inside this step's collapsed log; the
            # annotation puts the reason on the run summary where it is seen.
            Write-Host "::warning title=Store package skipped::$($plan.storeSkipReason)"
          }
          Write-Host "Store package version: $($plan.msixVersion)"

      # pwsh, not Windows PowerShell: the suite is developed and verified on
      # PowerShell 7, so run it on that same interpreter rather than making a
      # release build the first 5.1 execution of it.
      - name: Check Store packaging policy
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests\windows_store_policy_test.ps1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # Match CI: avoid parallel 7-Zip workers racing to create this root.
      - name: Prepare Qt extraction directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_WORKSPACE\Qt\6.12.0\msvc2022_64" | Out-Null

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          # Exact, not a wildcard. ci.yml's check-windows leg spells 6.12.0
          # exactly; with both exact, the per-PR build and the release build
          # agree by construction rather than by coincidence (#5487).
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          # Qt 6.8 LTS dropped MSVC 2019 builds — arch must be msvc2022.
          arch: 'win64_msvc2022_64'
          # PyPI aqtinstall 3.3.0 cannot read Windows 6.11+ per-arch folders
          # (aqtinstall#959 / #1000). Pin the unreleased fix until >3.3.0
          # ships. Same commit as ci.yml's AQTINSTALL_GIT_REF.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          # Match CI: this aqt revision requires >=1.1.3. Avoid the Windows
          # py7zr extraction flake (#995) using the runner's 7-Zip.
          py7zrversion: '==1.1.3'
          extra: '--external 7z'
          # Base Qt PDBs live in debug_info; each add-on keeps its PDBs in a
          # separate .debug_information module. Restrict the base archives to
          # the QtBase/QtSvg binaries AetherSDR actually deploys so release CI
          # does not download unrelated Qt debug data.
          modules: 'qtmultimedia qtserialport qtwebsockets qtshadertools debug_info qtmultimedia.debug_information qtserialport.debug_information qtwebsockets.debug_information'
          # Keep the software OpenGL fallback that the existing Windows package
          # ships; archive pruning must not change the runtime payload while
          # adding symbols. d3dcompiler_47 remains intentionally omitted by the
          # existing windeployqt --no-system-d3d-compiler flag below.
          archives: 'opengl32sw qtbase qtsvg'

      # Inno Setup is used by package-windows, which takes the copy on the
      # runner image rather than installing anything.
      - name: Install Ninja and LLVM
        run: choco install ninja llvm -y

      # zlib is bundled under third_party/zlib (1.3.1) — no vcpkg install
      # needed; CMake builds zlibstatic from source.  (#2651)

      # Each third-party dep is cached against the hash of its setup
      # script (which pins the version), so cache invalidates the moment
      # we bump a version.  Skips the upstream download + build entirely
      # on cache hit.
      - name: Cache Opus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-opus
        with:
          path: third_party/opus
          key: opus-${{ runner.os }}-${{ hashFiles('scripts/setup/setup-opus.ps1') }}

      - name: Setup Opus (SmartLink audio codec)
        if: steps.cache-opus.outputs.cache-hit != 'true'
        run: .\scripts\setup\setup-opus.ps1

      - name: Cache FFTW3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-fftw
        with:
          path: third_party/fftw3
          key: fftw-${{ runner.os }}-${{ hashFiles('scripts/setup/setup-fftw.ps1') }}

      - name: Setup FFTW3 float (NR4 dependency)
        if: steps.cache-fftw.outputs.cache-hit != 'true'
        run: .\scripts\setup\setup-fftw.ps1

      - name: Cache hidapi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-hidapi
        with:
          path: third_party/hidapi
          key: hidapi-${{ runner.os }}-${{ hashFiles('scripts/setup/setup-hidapi.ps1') }}

      - name: Setup hidapi (USB HID device support)
        if: steps.cache-hidapi.outputs.cache-hit != 'true'
        run: .\scripts\setup\setup-hidapi.ps1

      # PortAudio is what makes the CW sidetone run on the callback ("pull")
      # path with WASAPI, the same transport macOS and Linux already ship.
      # Without it HAVE_PORTAUDIO is undefined, CwSidetonePortAudioSink.cpp is
      # not compiled, and the shipped installer silently falls through to the
      # push-model QAudioSink — which is what every Windows build did before
      # #5200, including the #3193 WASAPI preference that was never active.
      # Static lib, so nothing to bundle in the Deploy step. (#5200)
      - name: Cache PortAudio
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-portaudio
        with:
          path: third_party/portaudio
          key: portaudio-${{ runner.os }}-${{ hashFiles('scripts/setup/setup-portaudio.ps1') }}

      - name: Setup PortAudio (CW sidetone callback sink)
        if: steps.cache-portaudio.outputs.cache-hit != 'true'
        run: .\scripts\setup\setup-portaudio.ps1

      - name: Cache DeepFilterNet3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-deepfilter
        with:
          path: third_party/deepfilter
          key: deepfilter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup/setup-deepfilter.ps1') }}

      - name: Setup DeepFilterNet3 (DFNR)
        if: steps.cache-deepfilter.outputs.cache-hit != 'true'
        run: .\scripts\setup\setup-deepfilter.ps1

      - name: Cache qtkeychain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-qtkeychain
        with:
          path: third_party/qtkeychain
          key: qtkeychain-${{ runner.os }}-qt6.12.0-202609280346-${{ hashFiles('scripts/setup/setup-qtkeychain.ps1') }}

      - name: Setup qtkeychain (SmartLink credential persistence)
        if: steps.cache-qtkeychain.outputs.cache-hit != 'true'
        run: .\scripts\setup\setup-qtkeychain.ps1

      - name: Setup ONNX Runtime (Silero VAD + speaker labeling + signal classifier)
        run: pwsh scripts/setup/setup-onnxruntime.ps1

      - name: Setup sherpa-onnx (non-whisper ASR backend)
        run: pwsh scripts/setup/setup-sherpa-onnx.ps1

      - name: Cache Vulkan SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ runner.os }}-${{ hashFiles('scripts/setup/setup-vulkan-sdk.ps1') }}

      # Runs unconditionally (not gated on the cache hit): the script skips the
      # heavy install when the SDK is already present but must still export
      # VULKAN_SDK to $GITHUB_ENV for the Configure + Deploy steps below.
      - name: Setup Vulkan SDK (whisper GPU backend)
        run: pwsh scripts/setup/setup-vulkan-sdk.ps1

      - name: Configure
        run: |
          # RelWithDebInfo (not Release): MSVC's Release config omits /Zi and
          # /DEBUG, so build/AetherSDR.pdb never gets produced and the
          # create-msix.ps1 -CreateUpload step silently ships .msixupload
          # packages with no symbols. RelWithDebInfo keeps -O2 optimization
          # (Ob1 vs Release's Ob2 — a negligible inlining difference) while
          # emitting a full PDB, which is what create-msix.ps1 bundles as
          # .appxsym for Partner Center crash symbolication (and what we keep
          # as a standalone artifact for our own WinDbg use).
          # REQUIRE_ASR_ONNX/SHERPA=ON guarantee the Silero VAD + speaker labeling
          # and the sherpa-onnx backend ship (fail the build if their setup scripts
          # didn't stage the runtimes). REQUIRE_ASR_GPU=ON does the same for the
          # whisper Vulkan (ggml-vulkan) GPU backend.
          #
          # whisper/ggml/ggml-vulkan compile from the vendored tree here, the
          # same as the AppImage and Apple-Silicon macOS legs, so a patch under
          # third_party/whisper.cpp reaches the Windows release without a
          # separately rebuilt release asset. ASR_USE_PREBUILT_WHISPER_GPU is
          # left at its default (OFF); it remains in CMakeLists.txt as the
          # fallback if the from-source compile does not fit this runner.
          #
          # CMAKE_PREFIX_PATH points find_package(Vulkan COMPONENTS glslc) and
          # find_package(SPIRV-Headers CONFIG) at the SDK staged by
          # setup-vulkan-sdk.ps1: glslc compiles ggml-vulkan's shaders and
          # vulkan-1.lib is the loader import lib. REQUIRE_ASR_GPU=ON makes a
          # miss on any of the three fatal. The runtime vulkan-1.dll is bundled
          # in the Deploy step.
          #
          # AETHER_GPU_SPECTRUM=ON is stated explicitly even though it is the
          # CMake default, so the request is legible next to the assertion that
          # follows — same shape as appimage.yml.
          #
          # Tee without `2>&1`, unlike the bash legs: GitHub runs pwsh with
          # $ErrorActionPreference='Stop', where merging a native command's
          # stderr into the pipeline can turn any CMake warning into a
          # terminating error and fail configure on a non-problem. Nothing is
          # lost — every line the assertion reads is message(STATUS), which
          # CMake writes to stdout, and Tee-Object still passes the console
          # output through for a human reading a failed run.
          #
          # $LASTEXITCODE survives the pipe (Tee-Object is a cmdlet, not a
          # native command), so a configure failure still fails this step —
          # the reason the bash legs need `set -o pipefail` and this one does
          # not.
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMQTT_TLS=OFF -DREQUIRE_KEYCHAIN=ON -DREQUIRE_SERIALPORT=ON -DREQUIRE_ASR_ONNX=ON -DREQUIRE_ASR_SHERPA=ON -DREQUIRE_ASR_GPU=ON -DAETHER_GPU_SPECTRUM=ON -DCMAKE_PREFIX_PATH="$env:VULKAN_SDK" -DENABLE_NVIDIA_AFX=ON -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" | Tee-Object -FilePath configure.log

      # AETHER_GPU_SPECTRUM=ON is a request, not a guarantee: CMake flips it
      # back OFF without failing when Qt6GuiPrivate can't be located, and
      # CMakeLists.txt names aqtinstall specifically as a layout that ships the
      # private QtGui headers on disk while omitting the Qt6GuiPrivate CMake
      # package — which is exactly what install-qt-action lays down here. So the
      # Windows installer could quietly ship the CPU QPainter fallback with this
      # workflow green, the same failure mode #4000 shipped on aarch64.
      #
      # Assert on the configure output, not CMakeCache.txt: CMakeLists.txt
      # disables the feature with a plain set(), which shadows the cache entry
      # without rewriting it, so the cache still reads ON when it is off.
      - name: Assert GPU spectrum rendering actually enabled
        run: |
          if (-not (Select-String -Path configure.log -Pattern 'GPU spectrum rendering enabled' -Quiet)) {
            Write-Host "ERROR: -DAETHER_GPU_SPECTRUM=ON but CMake disabled it. Relevant output:"
            Select-String -Path configure.log -Pattern 'GPU spectrum|Qt6GuiPrivate|private headers'
            exit 1
          }
          Select-String -Path configure.log -Pattern 'GPU spectrum rendering enabled'

      # Same shape as the GPU-spectrum guard above, and for the same reason:
      # the WIN32 PortAudio detection is soft-optional, so a missing or
      # half-restored third_party/portaudio makes CMake skip the callback sink
      # without failing. This workflow is the one place that matters most --
      # it produces what users install, so a silent skip would ship the
      # push-model QAudioSink while the release notes claim the callback path.
      # Fail here instead. (#5200)
      - name: Assert PortAudio sidetone sink actually enabled
        run: |
          if (-not (Select-String -Path configure.log -Pattern 'PortAudio \(third_party\) found' -Quiet)) {
            Write-Host "ERROR: setup-portaudio.ps1 ran but CMake did not find third_party/portaudio."
            Write-Host "The installer would ship the push-model QAudioSink sidetone. Refusing."
            Write-Host "--- third_party/portaudio ---"
            if (Test-Path third_party\portaudio) {
              Get-ChildItem -Recurse third_party\portaudio | Select-Object -ExpandProperty FullName
            } else {
              Write-Host "(third_party/portaudio does not exist)"
            }
            exit 1
          }
          Select-String -Path configure.log -Pattern 'PortAudio \(third_party\) found'
          # The line above proves CMake found a lib, not that the lib carries
          # the #5713 patch set - and CMake's detection is EXISTS-only, so a
          # stale or partially-restored tree passes it. The stamp records the
          # patch signature setup-portaudio.ps1 built with, so check it too.
          if (-not (Test-Path third_party\portaudio\.patched-5713)) {
            Write-Host "ERROR: third_party/portaudio has no #5713 patch stamp."
            Write-Host "The PortAudio in this build may still free a stack address in Pa_Initialize."
            exit 1
          }
          Write-Host "PortAudio patch stamp: $(Get-Content -Raw third_party\portaudio\.patched-5713)"

      - name: Build Opus (RADE dependency)
        # ExternalProject dependency ordering via BUILD_BYPRODUCTS is correct,
        # but a separate step gives clearer CI failure attribution and avoids
        # any Ninja parallel-build ordering edge cases with IMPORTED targets.
        run: cmake --build build --target build_opus -j $env:NUMBER_OF_PROCESSORS

      - name: Build whisper + ggml-vulkan (vendored ASR engine)
        # Its own step so the vendored engine's compile time is a separate line
        # in the run summary and a slow compile fails HERE with its log kept
        # (see the timeout note on Build below). Measured on windows-latest
        # with the /O1 override in effect: this step took 2 min 15 s at full
        # -j (run 35660187303, 2026-09-21), and the ggml-vulkan target alone
        # 2-3 min at -j 2 (ci/test-windows-gpu, 2026-07-22, runs 29904473886
        # and 29924632118). Most of it is the 132 per-shader glslc edges,
        # which are small and parallel, so full -j is safe here; the ~1 MB
        # ggml-vulkan.cpp TU is 15 CPU-s under /O1. The 16 GB thrash on
        # Build is about app TUs, not these. `whisper` pulls in ggml,
        # ggml-base, ggml-cpu and ggml-vulkan. If this step cannot fit the
        # runner, -DASR_USE_PREBUILT_WHISPER_GPU=ON in Configure restores the
        # prebuilt-asset path (and this step must then go: the targets become
        # IMPORTED, with no build rule) -- but the pinned whisper-gpu-1.9.1
        # pack predates the #5773 whisper.cpp load-check patch, so that
        # fallback ships the unpatched loader until the pack is rebuilt.
        # 60 min is 20x the measured step, and setup + 60 + Build's 240 +
        # packaging still fits under GitHub's 360 min job cancel, which
        # discards logs -- a step timeout keeps them.
        timeout-minutes: 60
        run: cmake --build build -j $env:NUMBER_OF_PROCESSORS --target whisper

      - name: Build
        # -j 2 (not full -j): even with ggml-vulkan already built, the main build was
        # thrashing 4-wide on the 16 GB runner — the ASR headers (ONNX C++ API /
        # whisper / vulkan-hpp) make many app TUs memory-heavy, so 4 concurrent
        # MSVC processes exceed RAM and swap. Halving parallelism gives each ~8 GB.
        # timeout-minutes fails the STEP (which preserves its log — unlike the
        # job-level 6 h cancel, which discards logs), so a still-slow build is
        # finally diagnosable; the job-level NINJA_STATUS stamps elapsed
        # seconds per line to expose the long-pole targets.
        timeout-minutes: 240
        # Only --target AetherSDR (+ its aether-dv-waveform helper dependency)
        # ships; the default `all` also built ~200 unit-test exes the installer
        # never packages or runs — wasted time, and their links contend with the
        # whisper-heavy app link on the 16 GB runner (same starvation we hit in
        # check-windows). Narrowing removes that risk too.
        run: cmake --build build -j 2 --target AetherSDR aether-dv-waveform

      - name: Deploy Qt
        run: |
          mkdir deploy
          copy build\AetherSDR.exe deploy\
          if (-not (Test-Path "build\aether-dv-waveform.exe")) {
            throw "Required ThumbDV helper build\aether-dv-waveform.exe is missing"
          }
          if (-not (Test-Path "build\AetherDV.cfg")) {
            throw "Required digital-voice manifest build\AetherDV.cfg is missing"
          }
          copy build\aether-dv-waveform.exe deploy\
          copy build\AetherDV.cfg deploy\
          # windeployqt treats any Qt6* DLL as an official Qt module and looks for
          # it in the Qt bin directory to scan its transitive dependencies. Copy
          # qt6keychain.dll there before invoking windeployqt so it can resolve it.
          if (Test-Path "third_party\qtkeychain\bin\qt6keychain.dll") {
            copy third_party\qtkeychain\bin\qt6keychain.dll "$env:QT_ROOT_DIR\bin\"
          }
          # --pdb copies symbols only for the exact Qt DLLs/plugins selected by
          # this deployment pass. The next step removes them from deploy/ and
          # flattens them beside AetherSDR.pdb for the x64 .appxsym.
          windeployqt deploy\AetherSDR.exe --release --pdb --no-translations --no-system-d3d-compiler
          if (Test-Path "third_party\fftw3\bin\libfftw3-3.dll") {
            copy third_party\fftw3\bin\libfftw3-3.dll deploy\
          }
          if (Test-Path "third_party\fftw3\bin\libfftw3f-3.dll") {
            copy third_party\fftw3\bin\libfftw3f-3.dll deploy\
          }
          if (Test-Path "third_party\hidapi\bin\hidapi.dll") {
            copy third_party\hidapi\bin\hidapi.dll deploy\
          }
          # zlib is statically linked from third_party/zlib (#2651) — no
          # DLL copy needed; zlibstatic is baked into AetherSDR.exe.
          if (Test-Path "third_party\deepfilter\lib\windows-x86_64\deepfilter.dll") {
            copy third_party\deepfilter\lib\windows-x86_64\deepfilter.dll deploy\
          }
          # Windows builds embed the DFNR model in AetherSDR.exe resources, so
          # no loose DeepFilterNet3_onnx.tar.gz payload is deployed.
          # NOTE: MQTT TLS is disabled (-DMQTT_TLS=OFF) so no OpenSSL DLLs
          # are needed. This avoids the "libssl-3-x64.dll not found" crash
          # on systems without OpenSSL installed (#1341, #1362).
          if (Test-Path "third_party\qtkeychain\bin\qt6keychain.dll") {
            copy third_party\qtkeychain\bin\qt6keychain.dll deploy\
          }
          # ASR runtime DLLs. CMake's POST_BUILD stages the ONNX Runtime + sherpa-onnx
          # DLLs next to build\AetherSDR.exe (root of the build dir, non-recursive);
          # windeployqt only handles Qt modules, so copy them into the payload here.
          Get-ChildItem build\*.dll -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Bundling ASR runtime DLL: $($_.Name)"
            Copy-Item $_.FullName deploy\ -Force
          }
          # Vulkan loader for the whisper GPU backend. ggml-vulkan hard-links
          # vulkan-1, so the DLL must ship or the exe fails to start even on
          # CPU-only machines (the loader then enumerates zero devices and ggml
          # falls back to CPU). Ships from the SDK; LunarG permits redistributing
          # the loader.
          # The loader DLL's location varies by SDK layout: newer LunarG SDKs stage
          # it under runtime\x64, older ones under Bin; a driver-installed copy sits
          # in System32. Take the first that exists (Bin alone is NOT reliable).
          $vkCandidates = @(
            (Join-Path $env:VULKAN_SDK "runtime\x64\vulkan-1.dll"),
            (Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll"),
            "$env:SystemRoot\System32\vulkan-1.dll"
          )
          $vkDll = $vkCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vkDll) { throw "vulkan-1.dll not found in: $($vkCandidates -join '; ')" }
          Write-Host "Bundling Vulkan loader: $vkDll"
          copy $vkDll deploy\

      - name: Stage application and Qt debug symbols
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\stage-debug-symbols.ps1 -DeployDir deploy -ApplicationPdb build\AetherSDR.pdb -OutputDir symbols -QtRootDir $env:QT_ROOT_DIR

      - name: Verify DPI awareness manifest
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\check-dpi-awareness.ps1 -ExePath deploy\AetherSDR.exe

      - name: Stage MSVC runtime for installer
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\stage-msvc-runtime.ps1 -OutputDir installer-runtime
          # Copied into deploy\ here rather than in the portable-ZIP step so the
          # audit below sees the SAME payload all three artifacts ship (portable
          # ZIP, Inno installer, MSIX all derive from deploy\ + this runtime).
          Copy-Item -Path installer-runtime\*.dll -Destination deploy\ -Force

      # Hard gate for the missing-runtime class (#4781: vcomp140.dll was never
      # staged, so the app died at startup on any machine whose system-wide VC++
      # redistributable had been removed or downgraded by another installer).
      # Runs before any artifact is built, so a payload that isn't self-contained
      # never reaches the ZIP, the installer, the MSIX or the release.
      - name: Verify deploy payload is self-contained
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\check-deploy-dependencies.ps1 -DeployDir deploy

      # The staging step above is a hard gate: it verifies every deployed Qt
      # DLL/plugin has its same-named PDB before removing symbols from deploy/.
      # Re-check the high-value symbols independently so a packaging refactor
      # cannot silently shrink the Store symbol surface. Keep this list in sync
      # with check-symbol-package.ps1's default RequiredPdbs list.
      - name: Verify required debug symbols present
        run: |
          $required = @("AetherSDR.pdb", "Qt6Core.pdb", "Qt6Gui.pdb", "Qt6Multimedia.pdb", "Qt6Network.pdb", "Qt6Widgets.pdb", "qwindows.pdb", "windowsmediaplugin.pdb")
          foreach ($pdb in $required) {
            if (-not (Test-Path (Join-Path "symbols" $pdb))) {
              throw "Required Store symbol is missing: symbols\$pdb"
            }
          }
          $symbolCount = @(Get-ChildItem symbols -File -Filter "*.pdb").Count
          Write-Host "Required symbols present; $symbolCount PDBs staged."

      # Complete application + Qt PDB set, kept separately from .msixupload so
      # maintainers can symbolize local dumps without unpacking Store assets.
      - name: Upload debug symbols
        if: hashFiles('symbols/AetherSDR.pdb') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-Symbols
          path: symbols/
          retention-days: 90

      # The same PDB set, kept with the release so it outlives the 90-day
      # artifact (docs/debugging-crashes.md), plus the waveform helper's PDB.
      # Staged in a copy because symbols/ is what the .appxsym check verifies.
      # .tar.xz on purpose: sign-release.yml downloads and checksums *.zip, so
      # a .zip here would change SHA256SUMS.txt.
      - name: Package debug symbols
        # Symbols are for us, not users: a failure here must not cost the release
        # its installers. A missing archive surfaces as /tag-release's WARN.
        continue-on-error: true
        if: hashFiles('symbols/AetherSDR.pdb') != ''
        run: |
          $safeRefName = $env:REF_NAME -replace '[\\/:*?"<>|]', '_'
          $archive = "AetherSDR-$safeRefName-Windows-x64-symbols.tar.xz"
          New-Item -ItemType Directory -Force symbols-release | Out-Null
          Copy-Item symbols\* symbols-release\ -Recurse -Force
          if (Test-Path build\aether-dv-waveform.pdb) {
            Copy-Item build\aether-dv-waveform.pdb symbols-release\
          }
          7z a -ttar symbols-release.tar .\symbols-release\* | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z tar failed ($LASTEXITCODE)" }
          7z a -txz -mmt=on $archive symbols-release.tar | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z xz failed ($LASTEXITCODE)" }
          Remove-Item symbols-release.tar
          Get-Item $archive | Format-Table Name, Length

      - name: Upload symbol archive
        if: hashFiles('AetherSDR-*-symbols.tar.xz') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-Symbols-archive
          path: AetherSDR-*-symbols.tar.xz

      # Everything package-windows needs, unsigned. The handoff is the trust
      # boundary: nothing in this job can sign, and nothing in package-windows
      # builds or fetches third-party code.
      - name: Upload unsigned payload for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-Payload
          path: |
            deploy/
            installer-runtime/
          # Long enough to re-run package-windows after a signing or Azure
          # outage without rebuilding.
          retention-days: 7
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Packaging and Authenticode signing (#6288). On release tags this is the
  # only job that can request the Azure OIDC token that signs as the AetherSDR
  # publisher. It runs our own scripts, the hash-pinned signing tools and the
  # Inno Setup already on the runner image; it compiles nothing and installs
  # no package, so build dependencies never run where that token is reachable.
  #
  # Every unsigned exe/dll in deploy\ and installer-runtime\ is signed before
  # the portable ZIP, so the ZIP, the Inno installer and the MSIX all ship the
  # same signed payload. Inno then signs its own setup exe and uninstaller
  # through the SignTool directive. Artifact Signing certificates are valid
  # for three days, so every signature is RFC 3161 timestamped.
  # ----------------------------------------------------------------------
  package-windows:
    needs: build-windows
    runs-on: windows-latest
    environment: ${{ needs.build-windows.outputs.sign == 'true' && 'windows-signing' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      AETHER_SIGN: ${{ needs.build-windows.outputs.sign }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download unsigned payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Windows-Payload
          path: .

      # The MSIX's .appxsym needs the PDBs, which build-windows already
      # uploads on their own.
      - name: Download debug symbols
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Windows-Symbols
          path: symbols

      - name: Azure login for Authenticode signing
        if: env.AETHER_SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The app's only role is Certificate Profile Signer on the signing
          # account, so it may not list the subscription.
          allow-no-subscriptions: true

      - name: Set up Authenticode signing tools
        if: env.AETHER_SIGN == 'true'
        run: |
          # Pinned and hash-checked NuGet packages rather than whatever SDK the
          # runner image carries: the dlib needs SignTool 10.0.22621.755 or
          # newer, and an image bump must not change the signing toolchain.
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $packages = @(
            @{ Id = 'Microsoft.Windows.SDK.BuildTools'; Version = '10.0.28000.2705'; Sha256 = '8bfdfb6ca2633f531cf80b5fa22512ba61a394d7988f0970db83baadc67929ed' },
            @{ Id = 'Microsoft.ArtifactSigning.Client'; Version = '1.0.128'; Sha256 = '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b' }
          )
          foreach ($p in $packages) {
            $zip = Join-Path $dir "$($p.Id).zip"
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/$($p.Id)/$($p.Version)" -OutFile $zip
            $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
            if ($hash -ne $p.Sha256) { throw "$($p.Id) $($p.Version): SHA256 $hash does not match the pinned $($p.Sha256)" }
            Expand-Archive -Path $zip -DestinationPath (Join-Path $dir $p.Id)
          }
          $signtool = Join-Path $dir 'Microsoft.Windows.SDK.BuildTools\bin\10.0.28000.0\x64\signtool.exe'
          $dlib = Join-Path $dir 'Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll'
          foreach ($tool in @($signtool, $dlib)) {
            if (-not (Test-Path $tool)) { throw "Signing tool missing after extraction: $tool" }
          }
          # The dlib authenticates with DefaultAzureCredential. Exclude every
          # source except the Azure CLI session azure/login just created, so a
          # credential the runner VM happens to expose can never be used.
          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = 'https://wus2.codesigning.azure.net'
            CodeSigningAccountName = 'aethersdrsign'
            CertificateProfileName = 'aethersdr-public'
            CorrelationId = "$env:GITHUB_REPOSITORY/$env:GITHUB_RUN_ID"
            ExcludeCredentials = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          # The one signtool argument list, shared by the payload step and
          # Inno's SignTool command so the two can never sign differently.
          # AETHER_SIGN_DESC is added for AetherSDR's own programs only: /d and
          # /du name the program in the signature, so UAC shows "Program name:
          # AetherSDR" with the website as its link (the individual
          # certificate can only carry the publisher's own name). Third-party
          # DLLs we sign get the publisher identity but no AetherSDR label.
          # RUNNER_TEMP has no spaces, so nothing here needs quoting.
          $signArgs = "sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $dlib /dmdf $metadata"
          "AETHER_SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "AETHER_SIGN_ARGS=$signArgs" >> $env:GITHUB_ENV
          "AETHER_SIGN_DESC=/d AetherSDR /du https://www.aethersdr.com/" >> $env:GITHUB_ENV

      - name: Sign payload
        if: env.AETHER_SIGN == 'true'
        run: |
          # Keep a vendor signature only when it is embedded, valid and
          # timestamped, which is what the gate below requires; sign everything
          # else, including the third-party and vendored DLLs that otherwise
          # have no publisher identity at all. The check reads the embedded
          # signature (authenticode.ps1 says why Get-AuthenticodeSignature
          # can't), so a Microsoft DLL also listed in a system catalog keeps
          # Microsoft's signature. Our own two programs are always signed, so
          # they carry the AetherSDR description.
          . .\packaging\windows\authenticode.ps1
          $ours = @('AetherSDR.exe', 'aether-dv-waveform.exe')
          $oursToSign = @(); $othersToSign = @()
          foreach ($f in Get-AuthenticodeTargets) {
            $state = Get-EmbeddedSignatureState -SignTool $env:AETHER_SIGNTOOL -Path $f.FullName
            if ($state.Valid -and $state.Timestamped -and $ours -notcontains $f.Name) {
              $subject = (Get-AuthenticodeSignature -FilePath $f.FullName).SignerCertificate.Subject
              Write-Host "Keeping existing signature: $($f.Name) ($subject)"
            } elseif ($ours -contains $f.Name) {
              $oursToSign += $f.FullName
            } else {
              $othersToSign += $f.FullName
            }
          }
          Write-Host "Signing $($oursToSign.Count + $othersToSign.Count) files ($($oursToSign.Count) AetherSDR programs)"
          $base = $env:AETHER_SIGN_ARGS -split ' '
          Invoke-AuthenticodeSign -SignTool $env:AETHER_SIGNTOOL -Arguments ($base + ($env:AETHER_SIGN_DESC -split ' ')) -Files $oursToSign
          Invoke-AuthenticodeSign -SignTool $env:AETHER_SIGNTOOL -Arguments $base -Files $othersToSign

      - name: Create portable ZIP
        run: |
          # Sanitize github.ref_name — release-tag pushes give a slash-free
          # "v26.5.3" but workflow_dispatch on a branch ref like
          # "codex/windows-store-msix" injects slashes that break the
          # Compress-Archive destination path.  Strip every filesystem-unsafe
          # character so ad-hoc dispatch runs (e.g. validating new packaging
          # work on a branch) reach the later Inno + MSIX steps instead of
          # exiting 1 at the very first artifact-creation step.
          $safeRefName = $env:REF_NAME -replace '[\\/:*?"<>|]', '_'
          Compress-Archive -Path deploy\* -DestinationPath "AetherSDR-$safeRefName-Windows-x64-portable.zip"

      - name: Create installer (Inno Setup)
        run: |
          # Inno Setup ships on the windows-latest image. It is not installed
          # here: this job must not run a package installer where the signing
          # token is reachable.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup is no longer on the runner image: $iscc" }
          # Same sanitization as the portable ZIP step — Inno also pukes on
          # filesystem-unsafe characters in /DAPP_VERSION.
          $version = $env:REF_NAME -replace '^v', '' -replace '[\\/:*?"<>|]', '_'
          $runtimeDir = (Resolve-Path "installer-runtime").Path
          $isccArgs = @("/DAPP_VERSION=$version", "/DVC_RUNTIME_DIR=$runtimeDir")
          if ($env:AETHER_SIGN -eq 'true') {
            # Inno substitutes the quoted output path for $f. Signing through
            # the directive is what covers unins000.exe, which Inno builds from
            # an embedded stub; a signtool pass over the output would miss it.
            # Inno retries a failed SignTool call on its own.
            $isccArgs += '/DSIGN'
            $isccArgs += "/Saethersign=$env:AETHER_SIGNTOOL $env:AETHER_SIGN_ARGS $env:AETHER_SIGN_DESC `$f"
          }
          & $iscc @isccArgs packaging\windows\installer.iss | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          # The uninstaller is embedded in the setup exe, where the gate cannot
          # reach it, so prove here that Inno signed it.
          if ($env:AETHER_SIGN -eq 'true' -and -not (Select-String -Path iscc.log -Pattern 'Successfully signed: .*uninst\.e32\.tmp' -Quiet)) {
            throw "Inno did not sign the uninstaller (no 'Successfully signed: ...uninst.e32.tmp' in the ISCC output)"
          }

      # MSIX runs AFTER the portable ZIP + Inno installer steps and is
      # gated with continue-on-error so a future MSIX hiccup (missing SDK
      # tool on a runner image bump, signtool flake, etc.) can't gate the
      # established portable-zip + Inno installer delivery path that real
      # users depend on.  When MSIX matures we can promote it back into
      # the hard-required artifact set.
      - name: Create MSIX package
        if: needs.build-windows.outputs.store-eligible == 'true'
        continue-on-error: true
        env:
          AETHERSDR_MSIX_VERSION: ${{ needs.build-windows.outputs.msix-version }}
          AETHERSDR_MSIX_IDENTITY_NAME: ${{ vars.AETHERSDR_MSIX_IDENTITY_NAME }}
          AETHERSDR_MSIX_PUBLISHER: ${{ vars.AETHERSDR_MSIX_PUBLISHER }}
          AETHERSDR_MSIX_DISPLAY_NAME: ${{ vars.AETHERSDR_MSIX_DISPLAY_NAME }}
          AETHERSDR_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.AETHERSDR_MSIX_PUBLISHER_DISPLAY_NAME }}
          AETHERSDR_MSIX_DESCRIPTION: ${{ vars.AETHERSDR_MSIX_DESCRIPTION }}
          AETHERSDR_MSIX_BACKGROUND_COLOR: ${{ vars.AETHERSDR_MSIX_BACKGROUND_COLOR }}
          AETHERSDR_MSIX_INSTALLER_ACCENT_COLOR: ${{ vars.AETHERSDR_MSIX_INSTALLER_ACCENT_COLOR }}
          AETHERSDR_MSIX_INSTALLER_BACKGROUND_COLOR: ${{ vars.AETHERSDR_MSIX_INSTALLER_BACKGROUND_COLOR }}
        run: |
          . .\packaging\windows\store-identity.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\create-msix.ps1 -DeployDir deploy -OutputDir . -PdbPath symbols\AetherSDR.pdb -SymbolDir symbols -CreateUpload -SkipSign -ExcludeDfnrModel -RequirePdb

      # Release gate for #6288: every exe/dll the portable ZIP, the installer
      # and the MSIX carry, and the setup exe itself, must validate under the
      # default Authenticode policy and be timestamped. The binaries we build
      # must be signed by our certificate, not merely by someone's.
      - name: Verify Authenticode signatures
        if: env.AETHER_SIGN == 'true'
        run: |
          $setup = @(Get-ChildItem -File -Filter 'AetherSDR-*-setup.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one setup exe, found $($setup.Count)" }
          . .\packaging\windows\authenticode.ps1
          $targets = @(Get-AuthenticodeTargets) + $setup
          # The MSIX is built from deploy\, so check that what it actually
          # packed is the signed payload, not just that deploy\ is signed.
          $msix = @(Get-ChildItem -File -Filter 'AetherSDR-*.msix')
          if ($msix.Count -eq 1) {
            $msixDir = Join-Path $env:RUNNER_TEMP 'msix-check'
            Copy-Item $msix[0].FullName "$msixDir.zip"
            Expand-Archive -Path "$msixDir.zip" -DestinationPath $msixDir -Force
            $targets += @(Get-ChildItem -Path $msixDir -Recurse -File -Include *.exe, *.dll)
            Write-Host "Including $($msix[0].Name) contents"
          }
          # One signtool verify /pa per file: a single call over every path
          # could outgrow the Windows command-line limit as the payload grows.
          foreach ($t in $targets) {
            $state = Get-EmbeddedSignatureState -SignTool $env:AETHER_SIGNTOOL -Path $t.FullName
            if (-not $state.Valid) { throw "$($t.Name): embedded signature does not validate" }
            if (-not $state.Timestamped) { throw "$($t.Name): embedded signature is not timestamped" }
          }
          $ours = @(
            (Get-Item deploy\AetherSDR.exe),
            (Get-Item deploy\aether-dv-waveform.exe),
            $setup[0]
          )
          # A subject name alone is not unique, so the issuer is pinned too:
          # Artifact Signing's identity-verified intermediates. Microsoft
          # numbers and rotates them (AOC CA 03 issued the first certificate),
          # and the leaf itself rotates every three days, so neither a
          # thumbprint nor a single intermediate can be pinned. A change to
          # the legal name or to Microsoft's CA naming fails the release
          # closed; update these two patterns then.
          foreach ($t in $ours) {
            $cert = (Get-AuthenticodeSignature -FilePath $t.FullName).SignerCertificate
            if ($cert.Subject -notmatch '^CN=Jeremy Fielder,') { throw "$($t.Name): signed by '$($cert.Subject)', not the AetherSDR certificate" }
            if ($cert.Issuer -notmatch '^CN=Microsoft ID Verified CS [AE]OC CA \d+, O=Microsoft Corporation, C=US$') { throw "$($t.Name): issued by '$($cert.Issuer)', not Artifact Signing's identity-verified CA" }
            Write-Host "$($t.Name): $($cert.Subject) / $($cert.Issuer)"
          }
          Write-Host "$($targets.Count) files carry valid, timestamped Authenticode signatures."

      # Signing is over; drop the session so no later step holds it.
      - name: End the signing session
        if: always() && env.AETHER_SIGN == 'true'
        run: |
          az logout 2>$null
          az account clear 2>$null
          "AETHER_SIGNTOOL=" >> $env:GITHUB_ENV
          "AETHER_SIGN_ARGS=" >> $env:GITHUB_ENV
          exit 0

      - name: Verify Store symbol package topology
        if: hashFiles('AetherSDR-*.appxsym') != ''
        run: |
          $appxSym = @(Get-ChildItem -File -Filter "AetherSDR-*.appxsym")
          $msixUpload = @(Get-ChildItem -File -Filter "AetherSDR-*.msixupload")
          if ($appxSym.Count -ne 1 -or $msixUpload.Count -ne 1) {
            throw "Expected exactly one .appxsym and one .msixupload. Found $($appxSym.Count) and $($msixUpload.Count)."
          }
          $appxSymPath = $appxSym[0].FullName
          $msixUploadPath = $msixUpload[0].FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\check-symbol-package.ps1 -AppxSymPath $appxSymPath -MsixUploadPath $msixUploadPath

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-Installer
          path: |
            AetherSDR-*.zip
            AetherSDR-*-setup.exe
            AetherSDR-*.msix
            AetherSDR-*.msixupload
            AetherSDR-*.appxsym

  # Publishing, apart from the signing identity: attaching to the GitHub
  # release needs contents: write, and the Store CLI is a third-party action.
  release-windows:
    needs: [build-windows, package-windows]
    if: needs.build-windows.outputs.release-artifacts == 'true' || needs.build-windows.outputs.production-draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Windows-Installer
          path: .

      # Package debug symbols is continue-on-error, so the archive may not
      # exist; a missing one is /tag-release's WARN, not a failed release.
      - name: Download symbol archive
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Windows-Symbols-archive
          path: .

      - name: Attach to release
        if: needs.build-windows.outputs.release-artifacts == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          # .msixupload is the Partner Center upload artifact (manual Store
          # submission for now — see docs/WINDOWS-STORE-MSIX.md). It's a
          # maintainer-only package; the raw .msix is intentionally left off
          # the public release because CI builds it unsigned (-SkipSign) and
          # an unsigned .msix can't be sideloaded by end users. The .msix is
          # still kept in the upload-artifact step for maintainer inspection.
          # The MSIX step is continue-on-error, so this glob may match nothing
          # on a failed build; softprops skips unmatched globs rather than
          # failing the release.
          files: |
            AetherSDR-*.zip
            AetherSDR-*-setup.exe
            AetherSDR-*.msixupload
            AetherSDR-*-symbols.tar.xz

      # ----------------------------------------------------------------------
      # Automated Microsoft Store submission (weekly release cycle).
      #
      # Runs ONLY on a v* tag push, and ONLY when the AETHERSDR_STORE_PRODUCT_ID
      # repository VARIABLE is set. The plan rejects manual tag dispatches and
      # forks for this path; manual flight requests have their own job below.
      #
      # The submission is staged as a DRAFT (publish-store.ps1 passes
      # --noCommit): the package uploads to Partner Center but certification is
      # NOT started. A maintainer reviews the pending submission and clicks
      # "Submit to Store". CI never publishes to the live channel on its own.
      #
      # Free-product only (AetherSDR qualifies). The app must already be live in
      # the Store. One-time Entra/Partner Center setup is in
      # docs/WINDOWS-STORE-MSIX.md.
      # ----------------------------------------------------------------------
      - name: Setup Microsoft Store Developer CLI
        if: needs.build-windows.outputs.production-draft == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0
        with:
          version: v0.4.2

      - name: Stage Microsoft Store submission (draft)
        if: needs.build-windows.outputs.production-draft == 'true'
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AETHERSDR_STORE_PRODUCT_ID: ${{ vars.AETHERSDR_STORE_PRODUCT_ID }}
        run: |
          msstore --version
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\publish-store.ps1 -ProductId $env:AETHERSDR_STORE_PRODUCT_ID -UploadTimeoutSeconds 300

  # A manually requested build can be committed to the restricted developer
  # package flight. This job is isolated from the tag-only production path:
  # it requires an explicit workflow_dispatch checkbox and a nonempty flight
  # secret, and it never changes or attaches anything to a GitHub release.
  publish-store-flight:
    name: Fully submit developer Store flight
    needs: [build-windows, package-windows]
    if: needs.build-windows.outputs.publish-flight == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    # Partner Center holds one in-progress submission per flight, so serialize
    # dispatches rather than racing them. Never cancel in progress: an upload
    # that has already started must be allowed to finish or be committed.
    concurrency:
      group: microsoft-store-flight
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Windows-Installer
          path: flight-package

      - name: Validate developer flight configuration
        env:
          AETHERSDR_STORE_PRODUCT_ID: ${{ vars.AETHERSDR_STORE_PRODUCT_ID }}
          AETHERSDR_STORE_FLIGHT_ID: ${{ secrets.AETHERSDR_STORE_FLIGHT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AETHERSDR_STORE_PRODUCT_ID)) {
            throw "AETHERSDR_STORE_PRODUCT_ID must contain the production app's Store product ID."
          }
          if ([string]::IsNullOrWhiteSpace($env:AETHERSDR_STORE_FLIGHT_ID)) {
            throw "AETHERSDR_STORE_FLIGHT_ID must contain the existing Partner Center developer flight ID. Refusing to fall back to production."
          }
          $uploads = @(Get-ChildItem flight-package -Recurse -File -Filter "AetherSDR-*.msixupload")
          if ($uploads.Count -ne 1) {
            throw "Expected exactly one verified .msixupload in the Windows-Installer artifact; found $($uploads.Count)."
          }
          Write-Host "Developer flight configuration and upload package are present."

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0
        with:
          version: v0.4.1

      - name: Commit developer Store flight submission
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AETHERSDR_STORE_PRODUCT_ID: ${{ vars.AETHERSDR_STORE_PRODUCT_ID }}
          AETHERSDR_STORE_FLIGHT_ID: ${{ secrets.AETHERSDR_STORE_FLIGHT_ID }}
        run: |
          msstore --version
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\publish-store.ps1 `
            -ProductId $env:AETHERSDR_STORE_PRODUCT_ID `
            -FlightId $env:AETHERSDR_STORE_FLIGHT_ID `
            -SearchDir flight-package `
            -UploadTimeoutSeconds 300 `
            -Commit
