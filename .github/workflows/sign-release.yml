name: Sign Release Artifacts

# GPG signs Linux AppImages and release tarballs, Windows binaries, and source
# archives. SHA256SUMS.txt also lists the PDF manual (Docs attaches it), which
# is verified through SHA256SUMS.txt.asc rather than a signature of its own.
# Docs completing triggers this too, so a manual attached or replaced after
# signing is re-signed (tools/release_manual_signing.py decides).
# macOS artifacts are signed via Apple codesign + notarization.

on:
  # NO `branches:` filter here, deliberately.  `branches: [main]` restricts the
  # workflow_run event to runs whose head branch is `main`, but a tag build's
  # head_branch is the tag (`v26.8.3`) — and the job's own `if` below requires
  # exactly that.  The two were mutually exclusive, so this trigger could only
  # ever skip: every signed release through v26.8.1 was signed by a manual
  # workflow_dispatch instead, and v26.8.2 shipped unsigned because nobody
  # remembered to run one.  The `if` is what restricts this to tags; a `main`
  # build still reaches it and is still skipped there.
  workflow_run:
    workflows: ["AppImage", "Windows Installer", "macOS DMG", "Docs"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sign (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

# AppImage, Windows Installer and macOS DMG all trigger this, so one tag
# produces up to three runs.  Serialise them per tag rather than letting them
# race on the same --clobber uploads.  GitHub keeps one pending run per group,
# so a third trigger cancels the one still pending; the run left after the
# last build re-signs the complete set, which is harmless because signing is
# idempotent in effect.
concurrency:
  group: sign-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # Whether this run signs. A build run always does. A Docs run (it runs on
  # the release event) signs only when the signed SHA256SUMS.txt doesn't cover
  # the manual now attached: signing ran while Docs had failed, or a Docs
  # rerun replaced the PDF. Before any signing it skips, because the
  # build-triggered runs list the manual themselves. This job holds no key
  # and asks for no approval; it runs the default branch's decision script
  # with a read-only token.
  plan:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) ||
        (github.event.workflow_run.name == 'Docs' && github.event.workflow_run.event == 'release')) &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      sign: ${{ steps.decide.outputs.sign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Docs' }}
        with:
          sparse-checkout: tools/release_manual_signing.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" != workflow_run ] || [ "$RUN_NAME" != Docs ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Not a release tag."
            exit 1
          fi
          mkdir -p probe
          pdf="AetherSDR-Manual-${TAG}.pdf"
          gh release download "$TAG" --dir probe --pattern "$pdf" --pattern SHA256SUMS.txt || true
          decision=$(python3 tools/release_manual_signing.py resign --name "$pdf" \
            --pdf "probe/$pdf" --sums probe/SHA256SUMS.txt)
          echo "$decision"
          if [ "$decision" = resign ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

  sign:
    # A build of this repository's own tag, pushed or dispatched, or a Docs
    # run the plan above says needs a re-sign; a run from any other
    # repository or event never reaches the release key.
    needs: plan
    if: ${{ needs.plan.outputs.sign == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      # The tag reaches scripts only through the environment and only once it
      # has the shape of a release tag; anything else stops the run here.
      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$RUN_HEAD_BRANCH"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Not a release tag; refusing to sign."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Check out the TAG being signed, not the default branch.  "Generate source
      # archive" below is `git archive HEAD`, so without this it archives main's
      # tip: a tarball named for the tag, containing whatever had merged since.
      # Signing that produces an authenticated misstatement, which is worse than
      # an unsigned release — so this ref is load-bearing, not tidiness.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # The build that triggered this run must have been of the tag's commit.
      - name: Check the build was of the tag
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha=$(git rev-parse HEAD)
          if [ "$tag_sha" != "$RUN_HEAD_SHA" ]; then
            echo "::error::The triggering build ran on $RUN_HEAD_SHA, not the tag's commit $tag_sha."
            exit 1
          fi

      # Whichever build finishes first triggers this run, while the other may
      # still be uploading.  Signing then covers a partial set and — worse —
      # SHA256SUMS.txt silently omits whatever had not landed yet, while still
      # looking like a complete manifest.  Wait for the full signable set first.
      # macOS DMGs are deliberately absent: they are Apple-notarized, not GPG
      # signed, so they are neither waited for nor signed here. The macOS app
      # tarballs (the in-app update's payload) are signed, like Linux's.
      - name: Wait for every signable artifact to be attached
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          want="x86_64.AppImage aarch64.AppImage Windows-x64-setup.exe Windows-x64-portable.zip"
          # Linux tarballs, when the tag's own AppImage build makes them.
          if grep -q -- '--tarball' .github/workflows/appimage.yml; then
            want="$want x86_64.tar.zst aarch64.tar.zst"
          fi
          # macOS app tarballs, when the tag's own macOS DMG build makes them.
          app=
          if grep -q -- '--app-tarball' .github/workflows/macos-dmg.yml; then
            app="macOS-apple-silicon.app.tar.zst macOS-intel.app.tar.zst"
          fi
          # The PDF manual, when the tag has the docs site that renders it
          # and the tag's own Docs workflow no longer signs it apart: the rule
          # tools/release_manual_signing.py `shape` and check_release_assets.py
          # share, so a dispatch for an older tag keeps that tag's shape.
          pdf=
          if [ -f tools/docs/build_pdf.py ] && [ -f docs/user/sidebars.js ] \
             && ! grep -q -- '--detach-sign' .github/workflows/docs.yml; then
            pdf="AetherSDR-Manual-${TAG}.pdf"
          fi
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"
          base="$want"
          for i in $(seq 1 90); do
            names=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
            # They are waited for only while the tag's macOS DMG build can
            # still attach them: once it has finished without one, Linux and
            # Windows are signed without it (a maintainer ruling).
            want="$base"
            if [ -n "$app" ]; then
              mac=$(gh run list --workflow "macOS DMG" --branch "$TAG" --limit 1 --json status --jq '.[0].status // ""')
              for w in $app; do
                case "$names" in
                  *"$w"*) want="$want $w" ;;
                  *) if [ "$mac" = completed ]; then
                       echo "::warning::$w is not attached and the macOS DMG build has finished; signing without it."
                     else
                       want="$want $w"
                     fi ;;
                esac
              done
            fi
            # Docs attaches it after the release is published. It is waited
            # for only while a Docs run for the tag can still attach it, the
            # same rule as the macOS tarballs above.
            if [ -n "$pdf" ]; then
              case "$names" in
                *"$pdf"*) want="$want $pdf" ;;
                *) docs=$(gh run list --workflow Docs --event release --branch "$TAG" --limit 1 --json status --jq '.[0].status // ""')
                   if [ -n "$docs" ] && [ "$docs" != completed ]; then
                     want="$want $pdf"
                   else
                     echo "::warning::$pdf is not attached and no Docs run for $TAG can still attach it; SHA256SUMS.txt will not list it."
                   fi ;;
              esac
            fi
            missing=
            for w in $want; do
              case "$names" in *"$w"*) ;; *) missing="$missing $w" ;; esac
            done
            if [ -z "$missing" ]; then
              echo "All signable artifacts present."
              exit 0
            fi
            echo "Waiting for:$missing  ($i/90)"
            sleep 20
          done
          echo "::error::Timed out after 30 min waiting for release artifacts:$missing"
          exit 1

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          PDF: ${{ steps.wait.outputs.pdf }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" \
            --dir artifacts --pattern '*.AppImage' --pattern '*.tar.zst' \
            --pattern '*.exe' --pattern '*.zip'
          # Only this tag's manual, by exact name, and only in the shape above.
          if [ -n "$PDF" ]; then
            gh release download "$TAG" --dir artifacts --pattern "$PDF" || \
              echo "::warning::$PDF is not attached; SHA256SUMS.txt will not list it."
          fi

      - name: Generate source archive
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git archive --format=tar.gz --prefix="AetherSDR-${TAG}/" \
            HEAD > "artifacts/AetherSDR-${TAG}-source.tar.gz"

      - name: Import GPG key
        env:
          # A keyring of its own, removed at the end of the job.
          GNUPGHOME: ${{ runner.temp }}/gnupg
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FP=$(gpg --list-secret-keys --with-colons | grep fpr | head -1 | cut -d: -f10)
          echo "${KEY_FP}:6:" | gpg --import-ownertrust

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt

      # Every file SHA256SUMS.txt lists gets a detached signature except the
      # PDF manual, whose only signature is SHA256SUMS.txt.asc.
      - name: Sign artifacts (detached .asc)
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: artifacts
        run: |
          for file in *.AppImage *.tar.zst *.exe *.zip *.tar.gz SHA256SUMS.txt; do
            [ -f "$file" ] || continue
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --detach-sign --armor "$file"
            echo "Signed: $file -> ${file}.asc"
          done

      - name: Upload signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            artifacts/*.asc artifacts/SHA256SUMS.txt \
            artifacts/*-source.tar.gz \
            --clobber

      - name: Remove the signing keyring
        if: ${{ always() }}
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
