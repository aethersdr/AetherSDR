name: Update Manifest

# Builds, signs and publishes the in-app update manifest for a release
# (RFC #5304 Phase 2; the format is docs/architecture/update-manifest.md).
#
# build    reads only: waits for the release's payload assets, extracts each
#          payload, and writes manifest.json plus one patch bundle per payload
#          and per earlier release (tools/build_update_manifest.py).
# publish  runs in the update-signing environment (v* tags only, maintainer
#          approval): signs the manifest with the Ed25519 update key, verifies
#          the signature against packaging/update-signing.pub, attaches the
#          bundles to the release and puts the manifest on
#          updates.aethersdr.com (an R2 bucket written by this job alone).
#
# A dispatch with publish=false is a dry run: build only, the outputs kept as
# a workflow artifact.

on:
  # No `branches:` filter, for the reason sign-release.yml gives: a tag
  # build's head_branch is the tag, and the job's `if` restricts this to tags.
  workflow_run:
    workflows: ["AppImage", "Windows Installer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v26.10.4)'
        required: true
      publish:
        description: 'Sign and publish (false: build only, as a dry run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Both builds trigger this, so one tag produces two runs. They queue rather
# than race; the second finds the manifest already published and stops.
concurrency:
  group: update-manifest-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # The tag reaches scripts only through the environment, and only once it
      # has the shape of a release tag (stable releases only: no suffix).
      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$RUN_HEAD_BRANCH"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag; no update manifest is built."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Check the build was of the tag
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha=$(git rev-parse HEAD)
          if [ "$tag_sha" != "$RUN_HEAD_SHA" ]; then
            echo "::error::The triggering build ran on $RUN_HEAD_SHA, not the tag's commit $tag_sha."
            exit 1
          fi

      # The tool and the public key come from this workflow's own commit (main
      # for a release, the dispatched ref for a dry run), not from the tag: a
      # tag cut before this workflow existed has neither.
      - name: Fetch the manifest tool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/tool"
          for f in tools/build_update_manifest.py packaging/update-signing.pub; do
            gh api "repos/$GH_REPO/contents/$f?ref=$WORKFLOW_SHA" -H 'Accept: application/vnd.github.raw' \
              > "$RUNNER_TEMP/tool/$(basename "$f")" || rm -f "$RUNNER_TEMP/tool/$(basename "$f")"
          done
          test -s "$RUNNER_TEMP/tool/build_update_manifest.py"

      # A second run for the same tag (both builds trigger this) stops here
      # once the first has published. A dispatch always builds.
      - name: Decide whether to publish
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=$INPUT_PUBLISH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://updates.aethersdr.com/releases/$TAG/manifest.json" || true)
          if [ "$code" = "200" ]; then
            echo "The manifest for $TAG is already published."
            echo "publish=already" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for every payload asset to be attached
        if: ${{ steps.plan.outputs.publish != 'already' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          want="x86_64.AppImage aarch64.AppImage Windows-x64-portable.zip"
          for i in $(seq 1 90); do
            names=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
            missing=
            for w in $want; do
              case "$names" in *"$w"*) ;; *) missing="$missing $w" ;; esac
            done
            if [ -z "$missing" ]; then
              echo "All payload assets present."
              exit 0
            fi
            echo "Waiting for:$missing  ($i/90)"
            sleep 20
          done
          echo "::error::Timed out after 30 min waiting for:$missing"
          exit 1

      - name: Install unsquashfs and zstd
        if: ${{ steps.plan.outputs.publish != 'already' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q squashfs-tools zstd

      - name: Build the manifest and patch bundles
        if: ${{ steps.plan.outputs.publish != 'already' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 "$RUNNER_TEMP/tool/build_update_manifest.py" --tag "$TAG" --out update-out \
            --fetch-from-github --depth 4 --work "$RUNNER_TEMP/update-work" \
            --public-key "$RUNNER_TEMP/tool/update-signing.pub"
          ls -l update-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ steps.plan.outputs.publish != 'already' }}
        with:
          name: update-manifest-${{ steps.tag.outputs.tag }}
          path: update-out/
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: update-signing
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: update-manifest-${{ needs.build.outputs.tag }}
          path: update-out

      - name: Fetch the public key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          gh api "repos/$GH_REPO/contents/packaging/update-signing.pub?ref=$WORKFLOW_SHA" \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/update-signing.pub"
          openssl pkey -pubin -in "$RUNNER_TEMP/update-signing.pub" -noout

      # Sign, then verify against the committed public key before anything
      # is uploaded: a wrong or rotated secret fails here, loudly, instead of
      # publishing a manifest no client can verify.
      - name: Sign and verify the manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/update-signing.pem"
          trap 'rm -f "$key"' EXIT
          ( umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key" )
          if ! python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["key_id"] else 1)' \
              update-out/manifest.json; then
            echo "::error::manifest.json has no key_id: packaging/update-signing.pub was missing at build time."
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$key" -in update-out/manifest.json \
            -out update-out/manifest.json.sig
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-signing.pub" \
            -in update-out/manifest.json -sigfile update-out/manifest.json.sig
          test "$(stat -c %s update-out/manifest.json.sig)" = 64

      - name: Attach the patch bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          shopt -s nullglob
          bundles=(update-out/*.update.tar)
          if [ ${#bundles[@]} -gt 0 ]; then
            gh release upload "$TAG" "${bundles[@]}" --clobber
          fi

      # The per-release copy first, then latest/, so latest/ never names a
      # release whose own copy is missing. latest/ moves only for the release
      # GitHub calls latest, so re-running an older tag never rolls it back.
      - name: Publish to updates.aethersdr.com
        id: r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UPDATES_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UPDATES_R2_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          put() {
            npx --yes wrangler@4.147.0 r2 object put "aethersdr-updates/$1" --file "$2" \
              --content-type "$3" --cache-control "$4" --remote
          }
          dirs="releases/$TAG"
          if [ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$TAG" ]; then
            dirs="$dirs latest"
          else
            echo "$TAG is not the latest release; latest/ is left as it is."
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          for dir in $dirs; do
            cache='public, max-age=31536000, immutable'
            [ "$dir" = latest ] && cache='no-cache'
            put "$dir/manifest.json" update-out/manifest.json application/json "$cache"
            put "$dir/manifest.json.sig" update-out/manifest.json.sig application/octet-stream "$cache"
          done

      - name: Check what was published
        env:
          DIRS: ${{ steps.r2.outputs.dirs }}
        run: |
          for dir in $DIRS; do
            curl -fsS "https://updates.aethersdr.com/$dir/manifest.json" -o served.json
            curl -fsS "https://updates.aethersdr.com/$dir/manifest.json.sig" -o served.sig
            cmp served.json update-out/manifest.json
            openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-signing.pub" \
              -in served.json -sigfile served.sig
          done
