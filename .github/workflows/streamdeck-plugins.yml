name: Stream Deck Plugins

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['plugins/**']

permissions:
  contents: write

jobs:
  # Runs on PRs touching plugins/. Until this existed the plugins had no gate
  # at all — a syntax error in plugin.js would have shipped in a release zip.
  test-elgato:
    runs-on: ubuntu-latest
    # Least privilege: this job executes repo-controlled JavaScript (test.js
    # spawns plugin.js as a child process) on a pull_request trigger, and needs
    # nothing beyond reading the checkout. The workflow-level `contents: write`
    # exists for the release-upload job below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Test Elgato plugin
        working-directory: plugins/elgato-aethersdr/com.aethersdr.radio.sdPlugin
        run: npm test

  upload-plugins:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Package Elgato plugin
        run: |
          cd plugins/elgato-aethersdr
          zip -r ../../com.aethersdr.radio.streamDeckPlugin com.aethersdr.radio.sdPlugin/ \
            -x "*/test.js"

      - name: Package StreamController plugin
        run: |
          cd plugins
          zip -r ../streamcontroller-aethersdr.zip streamcontroller-aethersdr/ \
            -x "*/__pycache__/*"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Wait for the release to exist (created by maintainer or another workflow)
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for release $TAG to be created... ($i/30)"
            sleep 10
          done
          # Create a draft release if it still doesn't exist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" --draft
          fi
          gh release upload "$TAG" \
            com.aethersdr.radio.streamDeckPlugin \
            streamcontroller-aethersdr.zip \
            --clobber
