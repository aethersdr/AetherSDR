name: CodeQL

# NO pull_request TRIGGER — deliberate (#4655).
#
# Analyzing C++ means building the scan targets with no compiler cache (ccache
# is unusable here: a cache hit means the compiler is never invoked, so the
# extractor sees no translation unit and coverage silently drops). That measured
# 39 min mean / 77 min max per run, making CodeQL the longest pole on every PR —
# longer than the entire CI matrix. It also ran twice per merged PR, since
# push:main re-scans the identical content ~10 min later.
#
# CodeQL is not a required status check and never blocked a merge, so the
# pre-merge run bought "surfaced on the PR" over "surfaced on main shortly
# after". We took the trade: scan once per merge, plus the weekly scan.
# Re-adding `pull_request:` here is a one-line change if the posture call
# changes — mirror the paths: block below when you do.
on:
  push:
    branches: [main]
    # Positive `paths:`, NOT `paths-ignore:`. GitHub skips a run only when EVERY
    # changed file matches an ignore pattern, so a single unlisted file re-arms
    # the whole workflow — and `tools/**` was never on the old ignore list.
    # #4585 changed exactly two files, a workflow YAML and a Python script, and
    # paid 58 min for a full Qt build to analyze neither of them. A positive
    # filter fires when ANY file matches, which is the rule we actually want.
    #
    # Scope = what the Build step compiles, because CodeQL can
    # only analyze translation units the build emits. tools/ is listed by
    # EXTENSION so a change to one of its Python scripts does not re-arm this;
    # tools/kiwi_directory_poc.cpp is a default target and does need coverage.
    # hal-plugin/ is deliberately absent — it is a separate CMake project built
    # only by packaging/macos/build-installer.sh, so this workflow never sees it.
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'tools/**.cpp'
      - 'tools/**.h'
      - 'CMakeLists.txt'
      # Test registration moved out of the root file into tests/tests.cmake.
      # Before that split, adding a test target touched CMakeLists.txt and
      # re-armed this workflow; without this line that trigger is lost.
      - 'tests/tests.cmake'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
      - 'tools/check_codeql_coverage.py'
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  # Run on a branch by hand, so a change to this file can be checked before
  # it merges rather than on main's first push after.
  workflow_dispatch:

# Push and schedule resolve to refs/heads/main, so each of those runs gets its
# own group (run_id suffix) and nothing is ever cancelled — the post-merge scan
# and the weekly scheduled scan stay fully parallel. A manual run on another
# branch shares that branch's group, so re-dispatching it cancels the stale
# run. The ref guard also keeps this correct if a pull_request trigger is ever
# restored.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Workflow-level least-privilege GITHUB_TOKEN. CodeQL's official guidance
# (https://github.com/github/codeql-action#permissions) is:
#   actions: read           — needed by the CodeQL action to inspect this
#                              workflow's metadata for category info.
#   contents: read          — needed by actions/checkout to fetch the repo.
#   security-events: write  — needed by the analyze step to upload SARIF.
# Previously the block sat at job level and declared only
# `security-events: write`, which (per GitHub's "specify any → unspecified
# default to none" rule) dropped contents and actions to none. It worked
# only because the repo is public; tightening to documented scopes makes
# the intent explicit and survives a hypothetical visibility change.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    container: ghcr.io/aethersdr/aethersdr-ci:latest
    env:
      # Dependencies bring in the app libraries and waveform helper. Retain
      # the two small tests whose first-party inputs are absent from the
      # default production graph: the opt-in DeepFist asset downloader and
      # the CTR2 firmware reference codec. The coverage check guards this list.
      CODEQL_BUILD_TARGETS: >-
        AetherSDR aetherd kiwi_directory_poc rade_demod_wav
        deepfist_model_assets_test ctr2_hid_reference_test

    strategy:
      matrix:
        language: [cpp]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fix git ownership for container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@7c1e4cf0b20d7c1872b26569c00ba908797a59bf
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # TRAP caching is OFF. It only ever speeds up PR analyses: on the
          # default branch the action logs "Analyzing default branch.
          # Skipping downloading of TRAP caches", and this workflow has no
          # pull_request trigger, so nothing ever restores one. What it DID
          # do is upload a ~2.9 GiB entry keyed on the commit sha from every
          # push:main run (5-23/day) into the repo's 10 GiB Actions cache
          # allowance. The action's own cleanup needs actions:write, which
          # this workflow deliberately does not grant, so it 403s silently
          # and LRU eviction was the only thing removing them — taking
          # ci.yml's compiler caches with it (#5548). Turning it on again
          # needs a pull_request trigger to make it worth its budget, and a
          # line in ci.yml's CCACHE_MAXSIZE budget table.
          trap-caching: false

      # CodeQL extracts compiler invocations, not debug info. Keep Release
      # even with the smaller target graph so extraction does not pay for -g.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # paths-ignore in the CodeQL config does not filter a manual C++ build.
      # Compare actual compiler inputs before narrowing extraction, so a new
      # src/ or tools/ input reachable only through a test cannot disappear.
      - name: Check first-party compilation coverage
        shell: bash
        run: |
          read -r -a targets <<< "$CODEQL_BUILD_TARGETS"
          python3 tools/check_codeql_coverage.py build "${targets[@]}" --output-dir build/codeql-coverage

      - name: Upload compilation coverage inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-compilation-coverage
          path: build/codeql-coverage/
          if-no-files-found: ignore

      - name: Build
        shell: bash
        run: |
          read -r -a targets <<< "$CODEQL_BUILD_TARGETS"
          cmake --build build --target "${targets[@]}" -j"$(nproc)"

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@7c1e4cf0b20d7c1872b26569c00ba908797a59bf

      # The compiler-input guard is not an extraction check. Preserve the
      # database's actual source archive inventory for branch/main comparison.
      - name: Inventory extracted CodeQL files
        env:
          CODEQL_DATABASES: ${{ steps.codeql-analyze.outputs.db-locations }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          prefix = os.environ['GITHUB_WORKSPACE'].lstrip('/') + '/'
          files = set()
          for location in json.loads(os.environ['CODEQL_DATABASES']).values():
              with ZipFile(Path(location) / 'src.zip') as archive:
                  for name in archive.namelist():
                      name = name.lstrip('/')
                      if name.startswith(prefix) and not name.endswith('/'):
                          files.add(name[len(prefix):])
          if not files:
              raise SystemExit('CodeQL source archive has no workspace files')
          Path('build/codeql-coverage/extracted-files.txt').write_text(
              ''.join(name + '\n' for name in sorted(files)), encoding='utf-8')
          print(f'CodeQL extracted {len(files)} workspace files')
          PY

      - name: Upload extraction inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-extraction-inventory
          path: build/codeql-coverage/extracted-files.txt
          if-no-files-found: error
